name: Local qualification artifacts
on:
  workflow_dispatch:
  workflow_call:
  pull_request:
permissions:
  contents: read
jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: v2.18.2
          args: build --snapshot --clean --single-target --output dist/dimsum
      - run: go test ./...
      - run: go vet ./...
      - run: node tests/qualification.mjs dist/dimsum --output qualification-macos --duration 5
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.runner }}-qualification
          path: qualification-macos/
          retention-days: 14
  installer:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f tests/installer.Dockerfile -t dimsum-installer-test .
      - run: docker run --rm dimsum-installer-test shellcheck -x -S warning install.sh scripts/install-service.sh deploy/setup-service.sh deploy/postinstall.sh deploy/preremove.sh tests/install.sh tests/package-install.sh
      - run: docker run --rm dimsum-installer-test
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: sh scripts/build-web.sh
      - run: node --test tests/*.test.mjs
      - run: npm --prefix web test
      - run: npm exec --prefix web -- playwright install --with-deps chromium
      - run: npm --prefix web run test:e2e
      - run: go test ./...
      - name: Browser integration against real Go APIs
        run: DIMSUM_BROWSER_TEST=1 go test ./internal/webassets -run 'TestBrowserAgainst(GoAPI|ManagedRuntime)$' -v -count=1
      - run: go test -race ./...
      - run: go vet ./...
      - name: Bounded parser fuzz smoke
        run: |
          go test ./internal/dnswire -run '^$' -fuzz '^FuzzQuestion$' -fuzztime=5s -parallel=2
          go test ./internal/dnswire -run '^$' -fuzz '^FuzzName$' -fuzztime=5s -parallel=2
          go test ./internal/dnswire -run '^$' -fuzz '^FuzzScanner$' -fuzztime=5s -parallel=2
          go test ./internal/dnscache -run '^$' -fuzz '^FuzzReconstruction$' -fuzztime=5s -parallel=2
          go test ./internal/lists -run '^$' -fuzz '^FuzzParse$' -fuzztime=5s -parallel=2
          go test ./internal/policy -run '^$' -fuzz '^FuzzIndexReference$' -fuzztime=5s -parallel=2
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: v2.18.2
          args: check
      - run: goreleaser build --snapshot --clean --single-target --output dist/dimsum
      - run: node tests/qualification.mjs dist/dimsum --output qualification-evidence --duration 30 --reload-every 5 --outage-every 10 --outage-for 2 --sample-every 2
      - run: goreleaser release --snapshot --clean --skip=publish,docker
      - name: Test packaged install and upgrade
        run: |
          docker build -f tests/installer.Dockerfile -t dimsum-installer-test .
          docker run --rm -v "$PWD/dist:/packages:ro" dimsum-installer-test sh tests/package-install.sh
      - uses: actions/upload-artifact@v4
        with:
          name: local-linux-artifacts
          path: |
            dist/
            qualification-evidence/
          retention-days: 14
  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build native container for Desktop deployment tests
        run: docker build --build-arg SOURCE_COMMIT="$(git rev-parse HEAD)" --build-arg SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)" --file deploy/Dockerfile --tag dimsum:smoke .
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: Check first boot, DNS, credentials and persistent volumes
        run: node tests/container-smoke.mjs dimsum:smoke
      - name: Export multi-platform OCI image locally
        run: docker buildx build --platform linux/amd64,linux/arm64 --build-arg SOURCE_COMMIT="$(git rev-parse HEAD)" --build-arg SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)" --file deploy/Dockerfile --output type=oci,dest=dimsum-local.oci.tar .
      - uses: actions/upload-artifact@v4
        with:
          name: local-multiplatform-image
          path: dimsum-local.oci.tar
          retention-days: 14

name: Local qualification artifacts
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: sh scripts/build-web.sh
      - run: npm --prefix web test
      - run: npm exec --prefix web -- playwright install --with-deps chromium
      - run: npm --prefix web run test:e2e
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...
      - name: Bounded parser fuzz smoke
        run: |
          go test ./internal/dnswire -run '^$' -fuzz '^FuzzQuestion$' -fuzztime=5s -parallel=2
          go test ./internal/dnswire -run '^$' -fuzz '^FuzzName$' -fuzztime=5s -parallel=2
          go test ./internal/dnswire -run '^$' -fuzz '^FuzzScanner$' -fuzztime=5s -parallel=2
          go test ./internal/dnscache -run '^$' -fuzz '^FuzzReconstruction$' -fuzztime=5s -parallel=2
          go test ./internal/lists -run '^$' -fuzz '^FuzzParse$' -fuzztime=5s -parallel=2
          go test ./internal/policy -run '^$' -fuzz '^FuzzIndexReference$' -fuzztime=5s -parallel=2
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: v2.18.2
          args: check
      - run: sh tests/deploy-service.sh
      - run: goreleaser build --snapshot --clean --single-target --output dist/dimsum
      - run: python3 scripts/qualification.py dist/dimsum --output qualification-evidence --duration 30 --reload-every 5 --outage-every 10 --outage-for 2 --sample-every 2
      - run: goreleaser release --snapshot --clean --skip=publish,docker
      - uses: actions/upload-artifact@v4
        with:
          name: local-linux-artifacts
          path: |
            dist/
            qualification-evidence/
          retention-days: 14
  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Export multi-platform OCI image locally
        run: docker buildx build --platform linux/amd64,linux/arm64 --build-arg SOURCE_COMMIT="$(git rev-parse HEAD)" --build-arg SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)" --file deploy/Dockerfile --output type=oci,dest=dimsum-local.oci.tar .
      - uses: actions/upload-artifact@v4
        with:
          name: local-multiplatform-image
          path: dimsum-local.oci.tar
          retention-days: 14

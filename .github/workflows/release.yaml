name: Publish release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    # Keep release cost bounded. The full cross-platform qualification workflow
    # remains available for PRs and manual runs; do not rebuild its OCI exports here.
    timeout-minutes: 12
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Verify source and browser integration
        timeout-minutes: 6
        run: |
          sh scripts/build-web.sh
          npm --prefix web test
          go test ./...
          go vet ./...
          npm exec --prefix web -- playwright install --with-deps chromium
          DIMSUM_BROWSER_TEST=1 go test ./internal/webassets -run 'TestBrowserAgainst(GoAPI|ManagedRuntime)$' -v -count=1
      # GoReleaser cross-compiles both architectures before packaging. The image
      # build only installs runtime packages; no emulated Go/frontend compilation.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: v2.18.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

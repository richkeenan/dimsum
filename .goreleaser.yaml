version: 2
project_name: dimsum
before:
  hooks:
    - sh scripts/build-web.sh
    - node scripts/artifact-metadata.mjs artifacts/packaging-metadata
builds:
  - id: dimsum
    main: ./cmd/dimsum
    binary: dimsum
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath, -buildvcs=false]
    ldflags:
      - -s -w -buildid= -X main.version={{ .Version }} -X main.commit={{ with index .Env "SOURCE_COMMIT" }}{{ . }}{{ else }}{{ $.FullCommit }}{{ end }} -X main.date={{ with index .Env "SOURCE_DATE" }}{{ . }}{{ else }}{{ $.CommitDate }}{{ end }}
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - guides/**
      - web/THIRD_PARTY.md
      - deploy/dimsum.service
      - deploy/dhcp-capabilities.conf
      - deploy/dimsum.sysusers
      - deploy/dimsum.example.yaml
      - deploy/setup-service.sh
      - scripts/install-service.sh
      - src: artifacts/packaging-metadata/**
        dst: metadata
nfpms:
  - id: native
    package_name: dimsum
    homepage: https://github.com/richkeenan/dimsum
    description: Private-network DNS filtering service
    maintainer: dimsum maintainers
    license: MIT
    formats: [deb]
    bindir: /usr/bin
    file_name_template: "{{ .PackageName }}_{{ .Version }}_{{ .Arch }}"
    dependencies: [systemd, curl, iproute2, util-linux]
    scripts:
      postinstall: deploy/postinstall.sh
      preremove: deploy/preremove.sh
    contents:
      - src: LICENSE
        dst: /usr/share/doc/dimsum/copyright
      - src: deploy/dimsum.service
        dst: /usr/lib/systemd/system/dimsum.service
      - src: deploy/dhcp-capabilities.conf
        dst: /usr/share/doc/dimsum/dhcp-capabilities.conf
      - src: deploy/dimsum.sysusers
        dst: /usr/lib/sysusers.d/dimsum.conf
      - src: deploy/dimsum.example.yaml
        dst: /usr/lib/dimsum/dimsum.example.yaml
      - src: deploy/setup-service.sh
        dst: /usr/lib/dimsum/setup-service.sh
      - src: artifacts/packaging-metadata/
        dst: /usr/share/doc/dimsum/metadata
        type: tree
checksum:
  name_template: checksums.txt
  algorithm: sha256
snapshot:
  version_template: "0.0.0-local-{{ .ShortCommit }}"
release:
  prerelease: auto
  extra_files:
    - glob: install.sh
changelog:
  sort: asc
dockers_v2:
  - images: [dimsum-local]
    # Container images are built locally; releases publish archives and packages.
    disable: "{{ not .IsSnapshot }}"
    tags: ["{{ .Version }}"]
    dockerfile: deploy/Dockerfile.goreleaser
    extra_files: [artifacts/packaging-metadata]
    labels:
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.version: "{{ .Version }}"
    platforms: [linux/amd64, linux/arm64]

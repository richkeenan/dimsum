version: 2
project_name: dimsum
before:
  hooks:
    - sh scripts/build-web.sh
    - python3 scripts/artifact-metadata.py dist/metadata
builds:
  - id: dimsum
    main: ./cmd/dimsum
    binary: dimsum
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath, -buildvcs=false]
    ldflags:
      - -s -w -buildid= -X main.version={{ .Version }} -X main.commit={{ .FullCommit }} -X main.date={{ .CommitDate }}
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - deploy/dimsum.service
      - deploy/dimsum.sysusers
      - deploy/dimsum.example.yaml
      - docs/operations/*.md
      - src: dist/metadata/**
        dst: metadata
nfpms:
  - id: native
    package_name: dimsum
    homepage: https://github.com/richkeenan/dimsum
    description: Private-network DNS filtering service (local qualification build)
    maintainer: dimsum maintainers
    formats: [deb]
    bindir: /usr/bin
    contents:
      - src: deploy/dimsum.service
        dst: /usr/lib/systemd/system/dimsum.service
      - src: deploy/dimsum.sysusers
        dst: /usr/lib/sysusers.d/dimsum.conf
      - src: deploy/dimsum.example.yaml
        dst: /usr/share/doc/dimsum/dimsum.example.yaml
      - src: dist/metadata/
        dst: /usr/share/doc/dimsum/metadata
        type: tree
checksum:
  name_template: checksums.txt
  algorithm: sha256
snapshot:
  version_template: "0.0.0-local-{{ .ShortCommit }}"
release:
  disable: true
changelog:
  disable: true
dockers_v2:
  - images: [dimsum-local]
    # v2 builds local per-architecture images in snapshot mode. Non-snapshot
    # image publishing is deliberately disabled until owner authorization.
    disable: "{{ not .IsSnapshot }}"
    tags: ["{{ .Version }}"]
    dockerfile: deploy/Dockerfile.goreleaser
    extra_files: [dist/metadata]
    labels:
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.version: "{{ .Version }}"
    platforms: [linux/amd64, linux/arm64]

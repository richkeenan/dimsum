# Download this file as compose.yaml, then run: docker compose up -d --wait
name: dimsum
services:
  dimsum:
    image: ${DIMSUM_IMAGE:-ghcr.io/richkeenan/dimsum:latest}
    environment:
      # Containers see Linux, not the Desktop host. Declare the LAN limitation.
      DIMSUM_DEPLOYMENT: docker-desktop
    ports:
      - "${DIMSUM_DNS_BIND:-0.0.0.0}:${DIMSUM_DNS_PORT:-53}:53/udp"
      - "${DIMSUM_DNS_BIND:-0.0.0.0}:${DIMSUM_DNS_PORT:-53}:53/tcp"
      - "${DIMSUM_ADMIN_BIND:-127.0.0.1}:${DIMSUM_ADMIN_PORT:-8080}:8080/tcp"
    user: "65532:65532"
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /run/dimsum:size=1m,mode=0700,uid=65532,gid=65532
    volumes:
      # New volumes inherit defaults and ownership from the image.
      - config:/etc/dimsum
      - state:/var/lib/dimsum
    restart: unless-stopped
    stop_grace_period: 30s
volumes:
  config:
  state:

# Exact DNS names only. Prefer device-specific services over websites, login,
# NTP and shared cloud CDNs. These are clues, not verified product identities.
# category, reason and icon are optional. Icons use Lucide's kebab-case names.
# AWS IoT's structured hostname matcher remains in Go.

- id: ring
  name: Ring device
  category: camera
  reason: Queries to Ring firmware services
  domains:
    - fw-eventstream.ring.com
    - fw-snaps.prod.gws.ring.amazon.dev
    - fw-eventstream.prod.gws.ring.amazon.dev
    - fw.prod.gws.ring.amazon.dev

- id: reolink
  name: Reolink device
  category: camera
  reason: Queries to Reolink push services
  domains:
    - pushx.reolink.com

# Home Mini endpoint observed in an independent network teardown:
# https://cyberhost.uk/octopus-home-mini-teardown-review/
- id: octopus-home-mini
  name: Octopus Home Mini
  category: appliance
  icon: zap
  reason: Queries to the Octopus Home Mini cloud endpoint
  domains:
    - aw1e0kzydzq4m-ats.iot.eu-west-1.amazonaws.com

# Nintendo platform-specific service names are documented by Pretendo's server

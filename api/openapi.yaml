openapi: 3.1.0
info:
  title: dimsum control API
  version: 1.0.0
  description: |
    All generation and job IDs are decimal strings. Content revisions and transaction IDs
    are opaque SHA256 strings. No unconfigured statistics dependency returns fabricated data.
    Browser-session mutations require Origin and X-CSRF-Token obtained at login.
    Opaque bearer tokens grant full administrator access without browser Origin/CSRF
    credentials. Tokens have a separate lifetime from browser sessions and remain
    valid until explicitly revoked. At most 32 tokens may be active; plaintext is
    returned only at creation. Collections use YAML
    schema field names. PATCH paths are relative to the collection (including index),
    or absolute configuration paths for settings. Unsupported comment-preserving edits
    fail explicitly. Successful saves include saved and active configuration identities.
    History windows are half-open [from,to), positive, and at most 366 days. Timestamps
    use UTC with at most microsecond precision. Defaults end at the current UTC minute
    and start one hour earlier; when only to is provided, from defaults to to minus
    one hour. All endpoints share these defaults. updated_at is the response computation
    time, not a promise of durable observation coverage; complete carries that meaning.
    Reuse explicit range values across requests for a fixed dashboard window.
    MCP tools are explicitly opted in with path-level x-mcp-tools metadata. Path and
    query parameters are top-level tool arguments; JSON request bodies use the body
    argument. Browser sessions, token management, password changes, binary downloads,
    event streams, and specification downloads remain HTTP/CLI/UI operations only.
security:
  - session: []
  - bearer: []
paths:
  /api/v1/icons:
    x-mcp-tools:
      get: {name: list_icons, description: 'List valid Lucide icon names installed in this dimsum version. Optional search is a case-insensitive substring of the icon name (for example plant finds plant-pot); omit search to get the complete alphabetical list. Use a returned name as icon in update_client_policy or update_device_rules when choosing an appropriate device icon.'}
    get:
      parameters:
        - in: query
          name: search
          schema: {type: string}
          description: Case-insensitive substring of the icon name; surrounding whitespace is ignored. Empty or omitted returns all names. No matches returns an empty items array.
      responses:
        '200':
          description: Matching installed icon names in alphabetical order
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {type: string}, uniqueItems: true}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/device-rules:
    x-mcp-tools:
      get: {name: get_device_rules, description: Read installed DNS device identification defaults and saved custom rules or overrides with revision and activation status}
      patch: {name: update_device_rules, description: 'Revision-checked device identification catalogue edits. Save a complete rule by id; built-in edits are stored as sparse differences. Enable/disable with action enable and enabled. Delete custom rules only. Reset with id restores that rule; reset without id removes ALL catalogue customisations using installed defaults. Manual device names/icons are unaffected. Read back saved revision and activation; DNS history refreshes within 30 seconds.'}
    get:
      responses:
        '200':
          description: Effective saved catalogue with per-rule installed baseline and origin
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeviceRulesRead'}
        default: {$ref: '#/components/responses/Error'}
    patch:
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DeviceRulesMutation'}
      responses:
        '200': {$ref: '#/components/responses/Activation'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/builtin-lists/{id}:
    x-mcp-tools:
      get: {name: get_builtin_list, description: Read the installed built-in baseline and saved shared domain additions and exclusions for an explicit subscription ID}
      patch: {name: update_builtin_list, description: 'Revision-checked add, remove, restore, or reset of shared built-in subscription exceptions. Changes affect every scope selecting this subscription. Removal restores normal matching, not an explicit deny. Reset uses the installed baseline. Read back saved revision and activation status.'}
    get:
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, minLength: 1}}
      responses:
        '200':
          description: Saved membership relative to the baseline in the installed executable; remote and unknown subscriptions return not found.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BuiltinListRead'}
        default: {$ref: '#/components/responses/Error'}
    patch:
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, minLength: 1}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BuiltinListMutation'}
      responses:
        '200': {$ref: '#/components/responses/Activation'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/client-policy:
    x-mcp-tools:
      get: {name: get_client_policy, description: Read desired and active effective policy with inherited field sources and subscription health for an explicit client ID or profile ID or the network}
      patch: {name: update_client_policy, description: 'Atomically save revision-checked sparse policy, identity relinking, or subscription plus device assignment in authoritative YAML. Select an explicit ID from list_clients; unknown or ambiguous names require user selection. New subscriptions default to network application off. Read back status and source usability; application is not proof of a successful download.'}
    get:
      parameters:
        - {name: scope, in: query, schema: {type: string, enum: [network, profile, client], default: network}}
        - {name: id, in: query, schema: {type: string}, description: 'Required for client/profile. Legacy naming-only identity is address:<canonical IP>.'}
      responses:
        '200':
          description: Saved desired policy and compiled effective values; active is null for a not-yet-active identity. Sources report download health separately.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ClientPolicyRead'}
        default: {$ref: '#/components/responses/Error'}
    patch:
      requestBody: &clientPolicyBody
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ClientPolicyMutation'}
      responses:
        '200': {$ref: '#/components/responses/Activation'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/client-policy/preview:
    x-mcp-tools:
      post: {name: preview_client_policy, description: Compile a revision-checked policy candidate without saving or downloading; report changed client IDs and pending downloads, readOnly: true}
    post:
      requestBody: *clientPolicyBody
      responses:
        '200':
          description: Impact relative to saved desired configuration, using currently loaded subscription membership. No DNS lookup or download.
          content:
            application/json:
              schema:
                type: object
                required: [revision, id, effective, changed_clients, network_changed, downloads_pending]
                properties:
                  revision: {type: string}
                  id: {type: string}
                  effective:
                    anyOf:
                      - {$ref: '#/components/schemas/EffectiveClientPolicy'}
                      - {type: 'null'}
                  changed_clients: {type: array, items: {type: string}}
                  network_changed: {type: boolean}
                  downloads_pending: {type: array, items: {type: string}}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/profiles:
    x-mcp-tools:
      get: {name: list_profiles, description: List saved reusable policy profiles; use update_client_policy with scope profile to create edit or delete by stable ID}
    get:
      responses:
        '200':
          description: Saved profiles and activation status
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: {$ref: '#/components/schemas/Activation'}
                  configuration_error: {type: string}
                  items: {type: array, items: {$ref: '#/components/schemas/PolicyProfile'}}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/dhcp:
    x-mcp-tools:
      get: {name: get_dhcp, description: Inspect saved DHCP settings and configuration revision before editing}
      patch: {name: update_dhcp, description: Apply revision-checked DHCP scalar edits then inspect get_dhcp_status for applied generation; after a timeout inspect before retrying}
    get:
      responses:
        '200':
          description: Saved settings; disabled incomplete configuration is editable without opening sockets or lease storage
          content:
            application/json:
              schema:
                type: object
                required: [status, config]
                properties:
                  status: {$ref: '#/components/schemas/Activation'}
                  config: {$ref: '#/components/schemas/DHCPSettings'}
                  setup: {$ref: '#/components/schemas/DHCPSetup'}
                  availability: {$ref: '#/components/schemas/DHCPAvailability'}
        default: {$ref: '#/components/responses/Error'}
    patch:
      description: Relative scalar paths only. Disable before changing interface, server_ip, subnet or local_domain while serving. Reservations use their own collection. A saved/active configuration generation does not mean DHCP has applied it.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DHCPSettingsMutation'}
      responses:
        '200': {$ref: '#/components/responses/Activation'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/dhcp/status:
    x-mcp-tools:
      get: {name: get_dhcp_status, description: Inspect DHCP desired versus applied generation and storage health without sending probes or opening storage}
    get:
      responses:
        '200':
          description: DHCP health is independent of DNS readiness. Runtime unavailable or disabled inspection says nothing about preserved offline ownership.
          content:
            application/json:
              schema:
                type: object
                required: [status, dhcp, runtime_available]
                properties:
                  status: {$ref: '#/components/schemas/Activation'}
                  runtime_available: {type: boolean, description: A runtime status provider is installed; this is not DHCP readiness}
                  availability: {$ref: '#/components/schemas/DHCPAvailability'}
                  dhcp:
                    anyOf:
                      - {$ref: '#/components/schemas/DHCPStatus'}
                      - {type: 'null'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/dhcp/leases:
    x-mcp-tools:
      get: {name: list_dhcp_leases, description: Inspect bounded lease pages; restart from the first page on lease_cursor_expired. No force-release or offline database access}
    get:
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 256, default: 100}}
        - {name: cursor, in: query, schema: {type: string, maxLength: 2048}, description: Opaque cursor tied to process boot, active config generation, lease generation/revision and all filters including limit. Obsolete cursors return 409 lease_cursor_expired; malformed cursors return 400.}
        - {name: state, in: query, schema: {$ref: '#/components/schemas/DHCPLeaseState'}}
        - {name: address, in: query, schema: {type: string, format: ipv4}, description: Exact IPv4 match}
        - {name: mac, in: query, schema: {type: string, maxLength: 17}, description: Exact Ethernet MAC match}
        - {name: client_id, in: query, schema: {type: string, maxLength: 510, pattern: '^([0-9a-fA-F]{2})+$'}, description: Exact opaque client ID bytes encoded as hex}
        - {name: hostname, in: query, schema: {type: string, maxLength: 63}, description: Exact client-supplied hostname match}
      responses:
        '200':
          description: Ascending numeric IPv4 order from a detached bounded snapshot; no open database transaction. Expiry governs advertised lifetime; hold_until governs conservative ownership. Empty unavailable snapshot does not imply empty durable state.
          content:
            application/json:
              schema:
                type: object
                required: [boot_id, generation, revision, runtime_available, items]
                properties:
                  boot_id: {type: string}
                  generation: {$ref: '#/components/schemas/UInt64'}
                  revision: {$ref: '#/components/schemas/UInt64'}
                  runtime_available: {type: boolean}
                  next_cursor: {type: string, maxLength: 2048}
                  items: {type: array, maxItems: 256, items: {$ref: '#/components/schemas/DHCPLease'}}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/dhcp/reservations:
    x-mcp-tools:
      get: {name: list_dhcp_reservations, description: Inspect configured reservations and the saved revision; no live lease reassignment}
      post: {name: add_dhcp_reservation, description: Add a revision-checked reservation then inspect DHCP applied status for ownership conflicts}
    get:
      responses:
        '200':
          description: Configured reservations bounded by max_leases (default 1024, absolute 4096)
          content:
            application/json:
              schema:
                type: object
                required: [status, items]
                properties:
                  status: {$ref: '#/components/schemas/Activation'}
                  items: {type: array, maxItems: 4096, items: {$ref: '#/components/schemas/DHCPReservation'}}
        default: {$ref: '#/components/responses/Error'}
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [revision, item]
              properties:
                revision: {type: string, minLength: 1}
                item: {$ref: '#/components/schemas/DHCPReservation'}
      responses:
        '200': {$ref: '#/components/responses/Activation'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/dhcp/reservations/{id}:
    x-mcp-tools:
      patch: {name: update_dhcp_reservation, description: Edit a reservation by stable ID with revision-checked scalar edits; existing leases remain owned}
      delete: {name: remove_dhcp_reservation, description: Remove reservation configuration by stable ID without revoking or force-releasing any live lease}
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, minLength: 1, maxLength: 63}}
    patch:
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DHCPReservationMutation'}
      responses:
        '200': {$ref: '#/components/responses/Activation'}
        default: {$ref: '#/components/responses/Error'}
    delete:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [revision]
              properties:
                revision: {type: string, minLength: 1}
      responses:
        '200': {$ref: '#/components/responses/Activation'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/openapi.json:
    get:
      summary: Read the authenticated OpenAPI document as JSON
      responses:
        '200':
          description: Authoritative OpenAPI document
          content:
            application/json:
              schema: {type: object}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/openapi.yaml:
    get:
      summary: Read the authenticated OpenAPI document as YAML
      responses:
        '200':
          description: Authoritative OpenAPI document
          content:
            application/yaml:
              schema: {type: string}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/tokens:
    get:
      summary: List active full-administrator bearer tokens
      responses:
        '200':
          description: Metadata only; plaintext tokens cannot be retrieved
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, maxItems: 32, items: {$ref: '#/components/schemas/Token'}}
        default: {$ref: '#/components/responses/Error'}
    post:
      summary: Create an opaque full-administrator bearer token
      description: At most 32 active tokens. Store the returned plaintext token; it is shown only once. Token management is not an MCP tool.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: {type: string, minLength: 1, maxLength: 80}
      responses:
        '200':
          description: Created token and one-time plaintext credential
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/Token'}
                  - type: object
                    required: [token]
                    properties:
                      token: {type: string, readOnly: true, description: Opaque full-administrator bearer credential returned only at creation}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/tokens/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    delete:
      summary: Revoke a bearer token immediately
      responses:
        '200':
          description: Token revoked; subsequent requests with it are unauthorized
          content:
            application/json:
              schema:
                type: object
                required: [revoked]
                properties:
                  revoked: {type: boolean, const: true}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/password:
    post:
      summary: Change the administrator password
      description: |
        Accepts 1–1024 UTF-8 bytes, including admin; no forced-change flow.
        Browser-session requests require the session cookie, Origin and X-CSRF-Token;
        bearer-authenticated requests do not require browser Origin/CSRF credentials.
        The permission-protected Unix socket uses filesystem authentication.
        Publishes an immutable credential generation through the configuration coordinator.
        All previous browser sessions are revoked before success returns; log in again.
        Bearer tokens have a separate lifetime and are revoked explicitly through token management.
        Pending external configuration edits or concurrent writes can return 409.
        CLI equivalent is dimsum control password @- with the same JSON body.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PasswordChange'}
      responses:
        '200': {$ref: '#/components/responses/Activation'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/catalog:
    x-mcp-tools:
      get: {name: get_catalog, description: Inspect predefined filter subscription choices}
    get:
      summary: Inspect predefined subscription choices
      description: Availability describes parser support, not download state. Defaults are metadata and do not enable subscriptions. CLI equivalent is dimsum control catalog.
      responses:
        '200':
          description: Predefined catalog metadata
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Catalog'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/config/backups/{id}:
    get:
      summary: Download the most recent completed configuration backup
      description: Owner-authenticated archive including necessary credentials. Expires at the next backup or restart.
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Configuration archive
          content:
            application/x-tar:
              schema: {type: string, format: binary}
        default: {$ref: '#/components/responses/Error'}
  /session:
    post:
      security: []
      summary: Authenticate the single administrator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: {type: string}
      responses:
        '200':
          description: HttpOnly SameSite=Strict cookie and CSRF token
          content:
            application/json:
              schema:
                type: object
                required: [csrf_token, expires_at]
                properties:
                  csrf_token: {type: string}
                  expires_at: {type: string, format: date-time}
        default: {$ref: '#/components/responses/Error'}
    delete:
      summary: Revoke current session
      security:
        - session: []
      responses:
        '200': {description: Logged out}
        default: {$ref: '#/components/responses/Error'}
  /health/live:
    get:
      security: []
      responses:
        '200': {description: Process live}
  /health/ready:
    get:
      security: []
      responses:
        '200': {description: Active configuration available}
        '503': {description: No active configuration}
  /api/v1/summary:
    x-mcp-tools:
      get: {name: get_summary, description: Get retained query totals and observation completeness}
    get:
      description: |
        Retained admitted-query totals; rejected admissions are separate. Full
        day/hour/minute buckets use aggregates, with exact detail for sub-minute
        edges, in one snapshot. Retention or observation gaps set complete=false;
        the requested window is never expanded. Unavailable history is 503.
      parameters: &rangeParameters
        - {$ref: '#/components/parameters/From'}
        - {$ref: '#/components/parameters/To'}
      responses:
        '200':
          description: Retained totals and observation completeness
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HistorySummary'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/timeseries:
    x-mcp-tools:
      get: {name: get_timeseries, description: Get bounded query history time buckets}
    get:
      description: |
        At most 1500 buckets. Auto resolution is 60, then 3600, then 86400 seconds
        according to the point budget. Full buckets use retained rollups; partial
        first/last buckets aggregate retained detail without expanding the requested
        window. Partial edges can therefore be incomplete after detail retention.
        In incomplete windows empty buckets are gaps with null counters, not zero
        traffic. Populated buckets retain actual counts but are marked incomplete.
      parameters:
        - {$ref: '#/components/parameters/From'}
        - {$ref: '#/components/parameters/To'}
        - {name: resolution_seconds, in: query, schema: {type: integer, enum: [60, 3600, 86400]}}
      responses:
        '200':
          description: Bounded history buckets
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HistorySeries'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/performance:
    x-mcp-tools:
      get: {name: get_performance, description: Get DNS response-time percentiles, trends, distribution and outcome timings}
    get:
      description: |
        Server-side resolution duration, including upstream waits, not client network
        round-trip time. Includes failed resolutions; excludes admission rejections.
        Whole-range percentiles merge observations, never average bucket percentiles.
        Fine histograms use 16 subdivisions per power of two (midpoint error at most
        3.125%, exact below 32 microseconds). Legacy rollups retain counts, averages and
        coarse distribution, but percentile values are null unless every included
        query has fine timing data. Incomplete coverage is distinct from precision.
        At most 1500 buckets; automatic resolution uses 60, then 3600, then 86400
        seconds. Partial edges use retained details in the same database snapshot.
      parameters:
        - {$ref: '#/components/parameters/From'}
        - {$ref: '#/components/parameters/To'}
        - {name: resolution_seconds, in: query, schema: {type: integer, enum: [60, 3600, 86400]}}
      responses:
        '200':
          description: Retained response-time metrics with explicit timing precision and observation coverage
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HistoryPerformance'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/rankings:
    x-mcp-tools:
      get: {name: get_rankings, description: Get top clients and blocked domains for a history window}
    get:
      description: |
        Top ten clients by admitted requests and exact domains by blocks, with
        stable identity ties. Full hourly aggregates and exact partial-hour detail
        are merged before ranking. active_clients counts all distinct retained
        admitted client addresses before the top-ten limit. Retention or observation
        gaps set complete=false; partial edges never expand the requested window.
      parameters: *rangeParameters
      responses:
        '200':
          description: Exact retained rankings
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HistoryRankings'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/queries:
    x-mcp-tools:
      get: {name: list_queries, description: List a bounded page of retained DNS queries}
    get:
      description: |
        Descending timestamp and ID keyset page with a fixed insertion ceiling.
        Cursor binds normalized filters and window. With a cursor, omitted from/to
        reuse its original window; repeat the same filters on every page. Malformed
        cursors and changed filters/range return 400 bad_request. Unknown or repeated
        parameters are rejected. No offset pagination or substring-name search.
      parameters:
        - {$ref: '#/components/parameters/From'}
        - {$ref: '#/components/parameters/To'}
        - {$ref: '#/components/parameters/Limit'}
        - {name: cursor, in: query, schema: {type: string, maxLength: 2048}}
        - {name: name, in: query, description: 'Exact DNS name copied from query logs, including three-digit decimal escapes, or a Unicode hostname (IDNA). Unicode and escapes cannot be mixed. Empty string or dot denotes root.', schema: {type: string}}
        - {name: client, in: query, description: Literal observed IPv4 or IPv6 address without zone, schema: {type: string}}
        - {name: outcome, in: query, schema: {$ref: '#/components/schemas/Outcome'}}
        - {name: qtype, in: query, description: 'DNS type mnemonic, decimal 1–65535, or TYPE<number>', schema: {type: string}}
        - {name: boot_id, in: query, description: 'Exact process boot identity; required with rule_id or upstream_id', schema: {type: string, minLength: 1, maxLength: 128}}
        - {name: generation, in: query, description: 'Canonical uint32 decimal configuration generation; required with rule_id or upstream_id', schema: {type: string, pattern: '^(0|[1-9][0-9]*)$'}}
        - {name: rule_id, in: query, description: 'Canonical uint32 decimal rule number, scoped by boot_id and generation', schema: {type: string, pattern: '^(0|[1-9][0-9]*)$'}}
        - {name: upstream_id, in: query, description: 'Canonical uint16 decimal upstream number, scoped by boot_id and generation because endpoints can change on reload', schema: {type: string, pattern: '^(0|[1-9][0-9]*)$'}}
        - {name: source_id, in: query, description: 'Exact archived source identity, at most 512 UTF-8 bytes. Legacy or oversized identities are unavailable, never inferred from descriptions.', schema: {type: string, minLength: 1, maxLength: 512}}
      responses:
        '200':
          description: Retained query page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HistoryQueries'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/queries/{id}:
    x-mcp-tools:
      get: {name: get_query, description: Inspect a retained DNS query by its decimal string ID}
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, pattern: '^[1-9][0-9]*$'}}
    get:
      description: One retained event with boot-scoped historical rule metadata; 404 if absent or expired.
      responses:
        '200':
          description: Available historical fields, explicitly distinguishing missing metadata
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HistoryDetail'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/settings:
    x-mcp-tools:
      get: {name: get_settings, description: Inspect authoritative configuration and activation status}
      patch: {name: update_settings, description: Apply revision-checked settings edits}
    get:
      responses:
        '200':
          description: Authoritative parsed configuration (no secret file contents), status, or configuration_error for invalid disk text
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {$ref: '#/components/schemas/Activation'}
                  config: {type: object}
                  configuration_error: {type: string}
        default: {$ref: '#/components/responses/Error'}
    patch: &patch
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Mutation'}
      responses:
        '200': {$ref: '#/components/responses/Activation'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/lists: &collection
    x-mcp-tools:
      get: {name: list_filter_lists, description: List configured filter subscriptions and activation status}
      post: {name: add_filter_list, description: Append a filter subscription using the current revision and item}
      patch: {name: update_filter_lists, description: 'Apply revision-checked filter subscription edits. Paths are relative to lists: ["1","enabled"] edits the second subscription; do not include "lists". Read list_filter_lists for indices and saved_revision first.'}
      delete: {name: remove_filter_list, description: Remove a filter subscription using the current revision and zero-based index}
    get:
      responses:
        '200':
          description: Configured items, not discovered statistics
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {$ref: '#/components/schemas/Activation'}
                  items: {type: array, items: {}}
                  configuration_error: {type: string}
        default: {$ref: '#/components/responses/Error'}
    post:
      <<: *patch
      description: Append one item using revision and item
    patch: *patch
    delete:
      <<: *patch
      description: Remove item using revision and zero-based index
  /api/v1/rules:
    <<: *collection
    x-mcp-tools:
      get: {name: list_rules, description: List configured DNS policy rules}
      post: {name: add_rule, description: Append a DNS policy rule using the current revision and item}
      patch: {name: update_rules, description: 'Apply revision-checked DNS policy rule edits. Paths are relative to rules, for example ["0","enabled"]; omit "rules". Read list_rules for indices and saved_revision first.'}
      delete: {name: remove_rule, description: Remove a DNS policy rule using the current revision and zero-based index}
  /api/v1/records:
    <<: *collection
    x-mcp-tools:
      get: {name: list_records, description: List configured local DNS records}
      post: {name: add_record, description: Append a local DNS record using the current revision and item}
      patch: {name: update_records, description: 'Apply revision-checked local DNS record edits. Paths are relative to records, for example ["0","ttl"]; omit "records". Read list_records for indices and saved_revision first.'}
      delete: {name: remove_record, description: Remove a local DNS record using the current revision and zero-based index}
  /api/v1/clients:
    <<: *collection
    x-mcp-tools:
      get: {name: list_clients, description: List configured client overrides and bounded retained observations}
      post: {name: add_client, description: Append a client override using the current revision and item}
      patch: {name: update_clients, description: 'Apply revision-checked client override edits. Paths are relative to clients, for example ["0","name"]; omit "clients". Read list_clients for indices and saved_revision first.'}
      delete: {name: remove_client, description: Remove a client override using the current revision and zero-based index}
    get:
      description: Configured overrides in items, plus optional bounded retained observations and cached names.
      parameters:
        - {$ref: '#/components/parameters/From'}
        - {$ref: '#/components/parameters/To'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: DNS-observed address identities, not a physical-device inventory
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ClientsResponse'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/upstreams:
    <<: *collection
    post:
      <<: *patch
      description: Add an encrypted or standard endpoint, or expand a provider preset atomically. No implicit plaintext downgrade.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpstreamAdd'}
    x-mcp-tools:
      get: {name: list_upstreams, description: List configured upstream DNS servers}
      post: {name: add_upstream, description: Append an upstream DNS server using the current revision and item}
      patch: {name: update_upstreams, description: 'Apply revision-checked upstream DNS server edits. Paths are relative to dns.upstreams, for example ["0"]; omit "dns" and "upstreams". Read list_upstreams for indices and saved_revision first.'}
      delete: {name: remove_upstream, description: Remove an upstream DNS server using the current revision and zero-based index}
  /api/v1/diagnostics:
    x-mcp-tools:
      get: {name: get_diagnostics, description: Inspect configuration and installed diagnostic measurements}
    get:
      responses:
        '200':
          description: Configuration and installed diagnostic measurements. dns_addresses lists client-facing IP:port endpoints from running DNS listeners, expanding wildcard binds to active interface addresses and excluding loopback and link-local addresses. Addresses on recognised container and VPN interfaces sort last using best-effort interface-name hints; within each group IPv4 precedes IPv6, then addresses and ports sort numerically. This order does not guarantee reachability. IPv6 endpoints use brackets. An empty list means no client-facing address was discovered.
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/blocking:
    x-mcp-tools:
      get: {name: get_blocking, description: Inspect blocking state and pause expiry}
      put: {name: set_blocking, description: Enable blocking or pause until an absolute expiry using the current revision}
    get:
      responses:
        '200': {description: 'Object with status, enabled, pause_until (RFC3339 UTC)'}
        default: {$ref: '#/components/responses/Error'}
    put:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [revision, enabled]
              properties:
                revision: {type: string}
                enabled: {type: boolean}
                pause_until: {type: string, format: date-time, description: Absolute future expiry required when enabled is false}
      responses:
        '200': {$ref: '#/components/responses/Activation'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/rules/test:
    x-mcp-tools:
      post: {name: explain_domain, description: Explain a domain decision with the active policy matcher without performing a DNS lookup, readOnly: true}
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string, description: 'DNS name copied from query logs, including ASCII labels and three-digit decimal escapes for arbitrary bytes, a Unicode hostname (IDNA), or a full HTTP/HTTPS URL. Surrounding whitespace is trimmed; URLs are tested using only their hostname. Unicode and escapes cannot be mixed. Empty string or dot denotes root. No DNS lookup is performed.'}
                qtype: {type: string, description: 'DNS type name or numeric type, defaults to A; local routing is type-aware. No DNS lookup is performed.'}
                generation: {type: string, pattern: '^[0-9]+$'}
                client_id: {type: string, description: Explicit configured ID; mutually exclusive with address}
                address: {type: string, description: Select by address and an authoritative unexpired DHCP MAC if available; mutually exclusive with client_id}
      responses:
        '200':
          description: Active selected policy with blocking and pause, local routing and private reverse precedence; no upstream lookup or alias-chain fetch
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ClientPolicyExplanation'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/config/transactions:
    x-mcp-tools:
      post: {name: stage_configuration, description: Validate and stage revision-checked settings edits without activating them}
    post:
      <<: *patch
      description: Validate/stage settings edits without activation
      responses:
        '200': {description: 'id (opaque content hash) and revision; commit explicitly'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/config/transactions/{id}/commit:
    x-mcp-tools:
      post: {name: commit_configuration, description: Commit a staged configuration transaction by its opaque content hash}
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    post:
      responses:
        '200': {$ref: '#/components/responses/Activation'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/jobs:
    x-mcp-tools:
      get: {name: list_jobs, description: Inspect the last 32 process-lifetime jobs and their results}
      post: {name: create_job, description: Start a refresh or backup or restore or diagnostic job and inspect its result with list_jobs}
    get:
      responses:
        '200':
          description: Last 32 jobs, process lifetime only
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/Job'}}
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              properties:
                kind: {type: string, enum: [refresh, backup, restore, upstream-probe, support-bundle, dhcp-check]}
                input:
                  description: 'For upstream-probe use UpstreamProbeInput; for support-bundle use SupportBundleInput. Diagnostic input is capped at 4 KiB. Validation failures are reported in the asynchronous job status.'
              allOf:
                - if:
                    properties:
                      kind: {const: dhcp-check}
                  then:
                    properties:
                      input: {$ref: '#/components/schemas/DHCPCheckInput'}
                - if:
                    properties:
                      kind: {const: upstream-probe}
                  then:
                    required: [input]
                    properties:
                      input: {$ref: '#/components/schemas/UpstreamProbeInput'}
                - if:
                    properties:
                      kind: {const: support-bundle}
                  then:
                    properties:
                      input: {$ref: '#/components/schemas/SupportBundleInput'}
      responses:
        '202':
          description: Accepted; one running job maximum
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Job'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/events:
    get:
      responses:
        '200':
          description: 'SSE: reset requires summary refetch; status includes configuration and jobs, at most once/second. Eight clients, two-second write deadline. No replay history.'
          content:
            text/event-stream:
              schema: {type: string}
        default: {$ref: '#/components/responses/Error'}
components:
  parameters:
    From:
      name: from
      in: query
      description: Inclusive UTC RFC3339 timestamp; default is to minus one hour.
      schema: {type: string, format: date-time}
    To:
      name: to
      in: query
      description: Exclusive UTC RFC3339 timestamp; default is current UTC minute.
      schema: {type: string, format: date-time}
    Limit:
      name: limit
      in: query
      schema: {type: integer, default: 100, minimum: 1, maximum: 200}
  securitySchemes:
    session: {type: apiKey, in: cookie, name: dimsum_session, description: Browser-session authentication; mutations also require Origin and X-CSRF-Token}
    bearer: {type: http, scheme: bearer, description: Opaque full-administrator token with independent lifetime until explicit revocation; checked on every HTTP request including MCP requests; no browser Origin/CSRF credentials required}
  schemas:
    BuiltinListRead:
      type: object
      required: [id, revision, status, entries, customized]
      properties:
        id: {type: string}
        revision: {type: string}
        status: {$ref: '#/components/schemas/Activation'}
        customized: {type: boolean}
        entries:
          type: array
          items:
            type: object
            required: [domain, origin, removed]
            properties:
              domain: {type: string}
              origin: {type: string, enum: [builtin, custom]}
              removed: {type: boolean}
    BuiltinListMutation:
      type: object
      additionalProperties: false
      required: [revision, action]
      properties:
        revision: {type: string, minLength: 1}
        action: {type: string, enum: [add, remove, restore, reset]}
        domain: {type: string, description: 'Plain domain required for add/remove/restore; omitted for reset. Case and trailing root dot are normalized.'}
    PolicyScope:
      type: object
      description: Empty object means network; otherwise the owning profile or client ID
      properties:
        kind: {type: string, enum: [profile, client]}
        id: {type: string}
    PolicySelectors:
      type: object
      additionalProperties: false
      properties:
        addresses: {type: array, items: {type: string}}
        cidrs: {type: array, items: {type: string}}
        macs: {type: array, items: {type: string}}
    PolicyUpstream:
      type: object
      additionalProperties: false
      required: [upstreams]
      properties:
        upstreams: {type: array, minItems: 1, maxItems: 16, items: {type: string}}
        fallback_upstreams: {type: array, maxItems: 16, items: {type: string}}
    PolicyRule:
      type: object
      required: [id, kind, action, pattern, enabled]
      properties:
        id: {type: string}
        kind: {type: string, enum: [exact, suffix, wildcard, glob, regex]}
        action: {type: string, enum: [allow, deny]}
        pattern: {type: string}
        enabled: {type: boolean}
    PolicyOverrides:
      type: object
      properties:
        blocking: {type: boolean}
        lists: {type: object, additionalProperties: {type: boolean}}
        upstream: {$ref: '#/components/schemas/PolicyUpstream'}
        rules: {type: array, items: {$ref: '#/components/schemas/PolicyRule'}}
    PolicyClient:
      type: object
      properties:
        policy_id: {type: string, readOnly: true, description: Present in list_clients items; exact selector for get/update_client_policy, including derived legacy IDs. Never stored in YAML.}
        id: {type: string, description: 'Omitted for legacy naming entries; effective identity is address:<canonical IP> until an explicit policy save with promote_id.'}
        address: {type: string}
        name: {type: string}
        icon: {$ref: '#/components/schemas/DeviceIcon'}
        selectors: {$ref: '#/components/schemas/PolicySelectors'}
        profile: {type: string}
        overrides: {$ref: '#/components/schemas/PolicyOverrides'}
        paused_until: {type: string, format: date-time}
    PolicyProfile:
      type: object
      required: [id]
      properties:
        id: {type: string}
        name: {type: string}
        policy: {$ref: '#/components/schemas/PolicyOverrides'}
    PolicyField:
      type: object
      additionalProperties: false
      required: [path]
      description: 'Relative policy path: [blocking], [lists, subscription-id], [upstream], or [rules]. Set value or reset:true, never null. Explicit equal-to-parent values remain overrides. Rules replace this owner’s small custom-rule collection only.'
      properties:
        path: {type: array, minItems: 1, maxItems: 2, items: {type: string}}
        reset: {type: boolean}
        value:
          oneOf:
            - {type: boolean}
            - {$ref: '#/components/schemas/PolicyUpstream'}
            - {type: array, items: {$ref: '#/components/schemas/PolicyRule'}}
      oneOf:
        - required: [value]
          properties:
            reset: {const: false}
        - required: [reset]
          properties:
            reset: {const: true}
          not: {required: [value]}
    PolicySubscription:
      type: object
      additionalProperties: false
      required: [id, url, dialect, domain_kind, enabled]
      properties:
        id: {type: string}
        url: {type: string}
        dialect: {type: string}
        domain_kind: {type: string, enum: [exact, suffix]}
        enabled: {type: boolean}
    ClientPolicyMutation:
      type: object
      additionalProperties: false
      required: [revision, scope]
      properties:
        revision: {type: string, minLength: 1}
        scope: {type: string, enum: [network, profile, client]}
        id: {type: string, description: Explicit stable ID or legacy address identity; names are never selectors}
        create: {type: boolean}
        delete: {type: boolean, description: Delete by stable ID without other changes; referenced profiles are rejected until assignments are resolved}
        promote_id: {type: string, pattern: '^[A-Za-z0-9_.-]{1,64}$', description: Required when explicitly saving policy on a legacy address identity}
        name: {type: string}
        icon: {$ref: '#/components/schemas/DeviceIcon', description: 'Client only. Named Lucide icon; empty string removes the explicit icon and restores automatic selection.'}
        selectors: {$ref: '#/components/schemas/PolicySelectors', description: Replace all selectors and remove legacy address while retaining stable ID and policy}
        lease_address: {type: string, description: 'Create or relink using MAC-only selectors from a generation-compatible unexpired committed DHCP lease. Mutually exclusive with selectors. No sticky dynamic IP is added.'}
        profile: {type: string, description: Assign one profile; empty string removes the assignment}
        paused_until: {type: string, format: date-time}
        reset_pause: {type: boolean}
        reset_all: {type: boolean, description: Remove all owner policy overrides; keep profile assignment and identity. Reset pause separately. Cannot be combined with fields.}
        fields: {type: array, maxItems: 128, items: {$ref: '#/components/schemas/PolicyField'}}
        subscribe: {type: array, maxItems: 64, items: {$ref: '#/components/schemas/PolicySubscription'}, description: 'Subscribe if ID is absent, always with default_apply:false; existing matching sources retain availability and application settings. Combine with fields [lists,id]=true for target-only application.'}
    EffectivePolicyBool:
      type: object
      required: [value, source]
      properties:
        value: {type: boolean}
        source: {$ref: '#/components/schemas/PolicyScope'}
    EffectiveClientPolicy:
      type: object
      required: [id, profile_id, blocking, filtering, paused_until, global_paused, lists, upstream_source, route_id, upstream, override_count, rules]
      properties:
        id: {type: string}
        profile_id: {type: string}
        blocking: {$ref: '#/components/schemas/EffectivePolicyBool'}
        filtering: {type: boolean, description: Effective blocking enabled and neither global nor device pause active; does not assert list download usability}
        paused_until: {type: string, format: date-time}
        global_paused: {type: boolean}
        lists: {type: object, additionalProperties: {$ref: '#/components/schemas/EffectivePolicyBool'}}
        upstream_source: {$ref: '#/components/schemas/PolicyScope'}
        route_id: {type: string}
        upstream:
          type: object
          required: [upstreams]
          properties:
            upstreams: {type: array, items: {type: string}, description: Empty when the network has no configured upstream}
            fallback_upstreams: {type: array, items: {type: string}}
        override_count: {type: integer}
        rules:
          type: array
          items:
            type: object
            required: [rule, source]
            properties:
              rule: {$ref: '#/components/schemas/PolicyRule'}
              source: {$ref: '#/components/schemas/PolicyScope'}
    ClientPolicyRead:
      type: object
      required: [status, scope, id, desired, effective, active]
      properties:
        status: {$ref: '#/components/schemas/Activation'}
        scope: {type: string, enum: [network, profile, client]}
        id: {type: string}
        desired:
          anyOf:
            - {$ref: '#/components/schemas/PolicyClient'}
            - {$ref: '#/components/schemas/PolicyProfile'}
            - {$ref: '#/components/schemas/NetworkPolicyDesired'}
        effective: {$ref: '#/components/schemas/EffectiveClientPolicy'}
        active:
          anyOf:
            - {$ref: '#/components/schemas/EffectiveClientPolicy'}
            - {type: 'null'}
    ClientPolicyExplanation:
      type: object
      required: [name, normalized, generation, client_id, matching_method, handling, effective, decision]
      properties:
        name: {type: string}
        normalized: {type: string}
        generation: {type: string, pattern: '^[0-9]+$'}
        client_id: {type: string}
        matching_method: {type: string, enum: [network, configured_id, address, dhcp_mac, cidr]}
        authoritative_mac: {type: string}
        handling: {type: string, enum: [policy, local, private_reverse]}
        effective: {$ref: '#/components/schemas/EffectiveClientPolicy'}
        decision:
          type: object
          required: [result, generation, rule_id, source_ids, scope]
          properties:
            result: {type: string, enum: [forward, allow, block, local, paused]}
            generation: {type: string, pattern: '^[0-9]+$'}
            rule_id: {type: string}
            source_ids: {type: array, items: {type: string}}
            scope: {$ref: '#/components/schemas/PolicyScope'}
    NetworkPolicyDesired:
      type: object
      required: [lists, upstream, rules]
      properties:
        blocking: {type: boolean, description: Omitted means the built-in network default true}
        lists: {type: object, additionalProperties: {type: boolean}, description: Only explicit default_apply values; omitted list IDs retain legacy enabled-source application}
        upstream:
          type: object
          required: [upstreams]
          properties:
            upstreams: {type: array, items: {type: string}}
            fallback_upstreams: {type: array, items: {type: string}}
        rules: {type: array, items: {$ref: '#/components/schemas/PolicyRule'}}
    Token:
      type: object
      required: [id, name, created_at]
      properties:
        id: {type: string, description: Opaque token metadata identifier; never a credential}
        name: {type: string, minLength: 1, maxLength: 80}
        created_at: {type: string, format: date-time}
    PasswordChange:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 1024
          writeOnly: true
          description: Nonempty password, maximum 1024 UTF-8 bytes. Fresh installations initialize a salted hash of admin only when no credential exists.
    Catalog:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/CatalogItem'}
    CatalogItem:
      type: object
      required: [id, label, description, url, dialect, domain_kind, available, unavailable_reason, default_enabled]
      properties:
        id: {type: string}
        label: {type: string}
        description: {type: string}
        category:
          type: string
          enum: [ads-trackers, security, social-gambling, parental-control, compatibility]
          description: Optional list-purpose classification used for catalogue groups and badges. Parental-control lists block adult content and are opt-in. Uncategorized subscriptions can be presented as custom lists.
        url: {type: string, format: uri}
        dialect: {type: string, enum: [hosts, domains, dns-adblock]}
        domain_kind: {type: string, enum: [exact, suffix]}
        available: {type: boolean}
        unavailable_reason: {type: string}
        default_enabled: {type: boolean}
    UpstreamProbeInput:
      type: object
      additionalProperties: false
      required: [endpoint]
      properties:
        endpoint: {type: string, description: 'IP:port, https://host/path or tls://host[:port] currently configured in the active primary or fallback pool; arbitrary destinations are rejected'}
        timeout_ms: {type: integer, minimum: 50, maximum: 3000, default: 1000}
    UpstreamProbeResult:
      type: object
      required: [endpoint, generation, name, qtype, state, responding, healthy, attempts, diagnostic_probes, duration_us, timeout_ms, checked_at]
      description: |
        One isolated root NS check using the validated DNS exchange engine, configured
        bootstrap resolvers and normal TLS certificate verification. Encrypted checks
        never downgrade to plaintext. Transport settings reload closes the private client. UDP
        may retry over TCP on truncation, at most two attempts within one deadline.
        Live configuration, cache, and upstream circuit state are unchanged. All
        actual attempts count once as non-client health probes; no client traffic
        or history event is recorded. Response errors/timeouts are completed
        diagnostic findings; parent cancellation fails the job.
      properties:
        endpoint: {type: string}
        generation: {$ref: '#/components/schemas/Decimal'}
        name: {type: string, const: '.'}
        qtype: {type: string, const: NS}
        state: {type: string, enum: [healthy, responding_error, no_valid_response, cancelled]}
        responding: {type: boolean, description: A validated DNS response was observed, not merely a reachable host}
        healthy: {type: boolean, description: This isolated check returned NOERROR; not a live circuit-state claim}
        rcode: {type: integer, minimum: 0, maximum: 65535}
        transport: {type: string, enum: [udp, tcp, tls, https], description: Actual transport on success; configured transport when no successful exchange is available. This field alone does not imply connectivity.}
        attempts: {$ref: '#/components/schemas/Decimal'}
        diagnostic_probes: {$ref: '#/components/schemas/Decimal'}
        duration_us: {$ref: '#/components/schemas/Decimal'}
        timeout_ms: {type: integer, minimum: 50, maximum: 3000}
        error: {type: string}
        checked_at: {type: string, format: date-time}
    SupportBundleInput:
      type: object
      additionalProperties: false
      description: History is omitted by default. Explicit opt-in also requires an explicit positive UTC from/to range of at most 24 hours. Range and limit are rejected without opt-in.
      properties:
        include_query_history: {type: boolean, default: false}
        from: {type: string, format: date-time}
        to: {type: string, format: date-time}
        limit: {type: integer, minimum: 1, maximum: 200, default: 50}
    SupportBundleResult:
      type: object
      required: [format, generated_at, build, configuration, diagnostics, contains_secrets, contains_query_history, query_history]
      description: JSON job result capped at 256 KiB; oversized bundles fail explicitly. No secret file contents or archive. URL userinfo, query values, and fragments are redacted, including diagnostic error messages.
      properties:
        format: {type: string, const: dimsum-support-v1}
        generated_at: {type: string, format: date-time}
        build:
          type: object
          required: [go_version, os, architecture, version]
          properties:
            go_version: {type: string}
            os: {type: string}
            architecture: {type: string}
            version: {type: string, description: Embedded Go module version or unknown; development builds can report '(devel)'}
            revision: {type: string}
            modified: {type: string}
        configuration: {type: object, description: Redacted settings inspection including saved/active status}
        diagnostics: {type: object}
        contains_secrets: {type: boolean, const: false}
        contains_query_history: {type: boolean}
        query_history:
          oneOf:
            - {$ref: '#/components/schemas/HistoryQueries'}
            - {type: 'null'}
    Decimal:
      type: string
      pattern: '^(0|[1-9][0-9]*)$'
      description: Unsigned integer encoded as a decimal string, including values beyond JavaScript exact integers.
    HistoryRange:
      type: object
      required: [from, to]
      properties:
        from: {type: string, format: date-time}
        to: {type: string, format: date-time}
    Outcome:
      type: string
      enum: [local, blocked, cache, stale, forwarded, error, rejected]
    HistorySummary:
      type: object
      required: [range, queries, blocked, fresh, stale, rejected, duration_us, complete, updated_at]
      properties:
        range: {$ref: '#/components/schemas/HistoryRange'}
        queries: {$ref: '#/components/schemas/Decimal', description: Admitted terminal query count, excluding rejected admissions}
        blocked: {$ref: '#/components/schemas/Decimal'}
        fresh: {$ref: '#/components/schemas/Decimal'}
        stale: {$ref: '#/components/schemas/Decimal'}
        rejected: {$ref: '#/components/schemas/Decimal'}
        duration_us: {$ref: '#/components/schemas/Decimal', description: Sum of admitted query durations in microseconds}
        complete: {type: boolean}
        updated_at: {type: string, format: date-time}
    NullableMicroseconds:
      description: Integer microseconds as a decimal string, or null when no measurement is available.
      oneOf:
        - {$ref: '#/components/schemas/Decimal'}
        - {type: 'null'}
    HistoryLatency:
      type: object
      required: [count, average_us, p50_us, p95_us, p99_us, percentiles_available]
      properties:
        count: {$ref: '#/components/schemas/Decimal', description: Observed admitted terminal queries}
        average_us: {$ref: '#/components/schemas/NullableMicroseconds', description: Arithmetic mean truncated to integer microseconds; null for no observations}
        p50_us: {$ref: '#/components/schemas/NullableMicroseconds', description: Approximate nearest-rank median}
        p95_us: {$ref: '#/components/schemas/NullableMicroseconds', description: Approximate nearest-rank 95th percentile}
        p99_us: {$ref: '#/components/schemas/NullableMicroseconds', description: Approximate nearest-rank 99th percentile}
        percentiles_available: {type: boolean, description: Nonempty and all included queries have fine timing data; independent of observation completeness}
    HistoryLatencyPoint:
      allOf:
        - {$ref: '#/components/schemas/HistoryLatency'}
        - type: object
          required: [time, complete, gap]
          properties:
            time: {type: string, format: date-time, description: Bucket start clipped to range.from; ends at next point or range.to}
            complete: {type: boolean, description: Observation coverage for this individual interval}
            gap: {type: boolean, description: No observations in an incomplete interval; must not be plotted as zero}
    HistoryLatencyOutcome:
      allOf:
        - {$ref: '#/components/schemas/HistoryLatency'}
        - type: object
          required: [outcome]
          properties:
            outcome: {type: string, enum: [local, blocked, cache, stale, forwarded, error]}
    HistoryLatencyBand:
      type: object
      required: [lower_us, upper_us, count]
      properties:
        lower_us: {$ref: '#/components/schemas/Decimal', description: Inclusive lower bound}
        upper_us: {$ref: '#/components/schemas/NullableMicroseconds', description: Exclusive upper bound; null means infinity}
        count: {$ref: '#/components/schemas/Decimal'}
    HistoryPerformance:
      type: object
      required: [summary, outcomes, distribution, points, resolution_seconds, range, complete, updated_at]
      properties:
        summary: {$ref: '#/components/schemas/HistoryLatency'}
        outcomes: {type: array, minItems: 6, maxItems: 6, items: {$ref: '#/components/schemas/HistoryLatencyOutcome'}}
        distribution:
          type: array
          minItems: 8
          maxItems: 8
          items: {$ref: '#/components/schemas/HistoryLatencyBand'}
          description: 'Duration bands, upper bounds in microseconds: 100, 500, 1000, 5000, 10000, 100000, 1000000, infinity. Preserves legacy precision.'
        points: {type: array, maxItems: 1500, items: {$ref: '#/components/schemas/HistoryLatencyPoint'}}
        resolution_seconds: {type: integer, enum: [60, 3600, 86400]}
        range: {$ref: '#/components/schemas/HistoryRange'}
        complete: {type: boolean, description: All chart intervals have complete retained observation coverage}
        updated_at: {type: string, format: date-time}
    QueryResponse:
      type: object
      description: Bounded summary of the reply sent to the client. Omitted on a query when response data was not recorded; no new DNS lookup is performed.
      required: [records, truncated]
      properties:
        truncated: {type: boolean, description: Some records or values were omitted by capture/summary limits; independent of the DNS TC flag}
        records:
          type: array
          maxItems: 16
          items:
            type: object
            required: [name, type, value, ttl, section]
            properties:
              name: {type: string, description: Byte-safe record owner; dot denotes root}
              type: {type: string, description: DNS type mnemonic or TYPE<number>}
              value: {type: string, maxLength: 1024, description: Record presentation; unsupported types use RFC 3597-style hexadecimal data}
              ttl: {type: integer, minimum: 0, maximum: 4294967295, description: TTL in seconds as returned to this client at query time, not a live countdown}
              section: {type: string, enum: [answer, authority, additional]}
    HistoryQuery:
      type: object
      required: [id, boot_id, sequence, time, client, client_name, client_name_source, client_name_fresh, name, qtype, qtype_code, qclass, outcome, rcode, duration_us, generation, rule_id, upstream_id, flags]
      properties:
        id: {$ref: '#/components/schemas/Decimal'}
        boot_id: {type: string, description: Boot scope for generation and rule identifiers}
        sequence: {$ref: '#/components/schemas/Decimal'}
        time: {type: string, format: date-time}
        client: {type: string, description: Observed address, always present independently of its friendly name}
        client_name: {type: string, description: Current cached friendly name; empty when unknown, not a historical identity claim}
        client_name_source: {type: string}
        client_name_expires: {type: string, format: date-time, description: Expiry of the derived client name; omitted for authoritative configured names.}
        client_name_fresh: {type: boolean}
        client_device: {$ref: '#/components/schemas/DeviceEnrichment'}
        name: {type: string, description: Lowercase byte-safe DNS presentation with decimal escapes; root is empty}
        qtype: {type: string, description: DNS type mnemonic or TYPE<number>}
        qtype_code: {type: integer, minimum: 0, maximum: 65535}
        qclass: {type: integer, minimum: 0, maximum: 65535}
        outcome: {$ref: '#/components/schemas/Outcome'}
        rcode: {type: integer, minimum: 0, maximum: 65535}
        duration_us: {$ref: '#/components/schemas/Decimal'}
        generation: {$ref: '#/components/schemas/Decimal'}
        rule_id: {$ref: '#/components/schemas/Decimal'}
        source_id: {type: string, description: 'Exact archived source identity; empty when unavailable (including legacy history and identities exceeding 512 bytes)'}
        upstream_id: {$ref: '#/components/schemas/Decimal'}
        flags: {type: integer, minimum: 0, maximum: 4294967295, description: 'Bits 0 TCP, 1 coalesced, 2 fallback used, 3 truncated, 4 response-policy block'}
        response: {$ref: '#/components/schemas/QueryResponse'}
    HistoryQueries:
      type: object
      required: [items, complete, range, updated_at]
      properties:
        items: {type: array, maxItems: 200, items: {$ref: '#/components/schemas/HistoryQuery'}}
        next_cursor: {type: string, description: Omitted on the last page; opaque base64url value}
        complete: {type: boolean, description: Observation/retention completeness, not whether there are more pages}
        range: {$ref: '#/components/schemas/HistoryRange'}
        updated_at: {type: string, format: date-time}
    HistoryDetail:
      allOf:
        - {$ref: '#/components/schemas/HistoryQuery'}
        - type: object
          required: [alias_available, rule_description_available, alias_chain_available, upstream_attempts_available, cache_age_available, ad_trust_available, updated_at]
          properties:
            alias: {type: string, description: One retained matched alias, not a reconstructed chain}
            alias_available: {type: boolean}
            rule_description: {type: string}
            rule_description_available: {type: boolean}
            alias_chain_available: {type: boolean, const: false}
            upstream_attempts_available: {type: boolean, const: false}
            cache_age_available: {type: boolean, const: false}
            ad_trust_available: {type: boolean, const: false}
            updated_at: {type: string, format: date-time}
    HistoryRankings:
      type: object
      required: [active_clients, clients, domains, complete, range, updated_at]
      properties:
        active_clients: {$ref: '#/components/schemas/Decimal', description: Distinct client addresses with retained admitted queries across the whole range before the top-ten limit. Coverage is indicated by complete.}
        clients:
          type: array
          maxItems: 10
          items:
            type: object
            required: [address, name, name_source, count]
            properties:
              device: {$ref: '#/components/schemas/DeviceEnrichment'}
              address: {type: string}
              name: {type: string}
              name_source: {type: string, description: Source of the displayed name, independent of device classification clues}
              count: {$ref: '#/components/schemas/Decimal'}
        domains:
          type: array
          maxItems: 10
          items:
            type: object
            required: [name, count]
            properties:
              name: {type: string}
              count: {$ref: '#/components/schemas/Decimal'}
        complete: {type: boolean}
        range: {$ref: '#/components/schemas/HistoryRange'}
        updated_at: {type: string, format: date-time}
    OutcomeCounts:
      type: object
      required: [local, blocked, cache, stale, forwarded, error, rejected]
      properties:
        local: {$ref: '#/components/schemas/Decimal'}
        blocked: {$ref: '#/components/schemas/Decimal'}
        cache: {$ref: '#/components/schemas/Decimal'}
        stale: {$ref: '#/components/schemas/Decimal'}
        forwarded: {$ref: '#/components/schemas/Decimal'}
        error: {$ref: '#/components/schemas/Decimal'}
        rejected: {$ref: '#/components/schemas/Decimal'}
    HistoryPoint:
      type: object
      required: [time, outcomes, duration_us, histogram, complete, gap]
      properties:
        time: {type: string, format: date-time, description: Bucket start clipped to from for a partial first bucket; ends at the next point or range.to}
        outcomes:
          oneOf:
            - {$ref: '#/components/schemas/OutcomeCounts'}
            - {type: 'null'}
        duration_us:
          oneOf:
            - {$ref: '#/components/schemas/Decimal'}
            - {type: 'null'}
        histogram:
          type: [array, 'null']
          minItems: 8
          maxItems: 8
          items: {$ref: '#/components/schemas/Decimal'}
          description: 'Exclusive microsecond upper bounds: 100, 500, 1000, 5000, 10000, 100000, 1000000, infinity; all terminal outcomes'
        complete: {type: boolean, description: Conservative coverage status for the aligned interior or individual partial edge}
        gap: {type: boolean, description: No observed counts in an incomplete window; null counters must not be graphed as zero}
    HistorySeries:
      type: object
      required: [points, resolution_seconds, complete, range, updated_at]
      properties:
        points: {type: array, maxItems: 1500, items: {$ref: '#/components/schemas/HistoryPoint'}}
        resolution_seconds: {type: integer, enum: [60, 3600, 86400]}
        complete: {type: boolean}
        range: {$ref: '#/components/schemas/HistoryRange'}
        updated_at: {type: string, format: date-time}
    ObservedClients:
      type: object
      required: [items, complete, truncated, range, updated_at]
      properties:
        items:
          type: array
          maxItems: 200
          items:
            type: object
            required: [address, name, name_source, name_fresh, count, blocked, last_seen]
            properties:
              device: {$ref: '#/components/schemas/DeviceEnrichment'}
              address: {type: string}
              name: {type: string}
              name_source: {type: string}
              name_expires: {type: string, format: date-time, description: Expiry of the derived client name; omitted for authoritative configured names.}
              name_fresh: {type: boolean}
              client_id: {type: string, description: Currently selected configured identity; empty means network}
              matching_method: {type: string, enum: [network, address, dhcp_mac, cidr]}
              authoritative_mac: {type: string, description: Only present from an unexpired committed generation-compatible DHCP lease; discovery and reservations alone are not authority}
              count: {$ref: '#/components/schemas/Decimal'}
              blocked: {$ref: '#/components/schemas/Decimal'}
              last_seen: {type: string, format: date-time}
        complete: {type: boolean}
        truncated: {type: boolean, description: More than limit observed addresses; distinct from missing observation coverage}
        range: {$ref: '#/components/schemas/HistoryRange'}
        updated_at: {type: string, format: date-time}
    DeviceEvidence:
      type: object
      required: [source, updated, expires]
      properties:
        source: {type: string}
        hostname: {type: string, maxLength: 1024}
        service_type: {type: string, maxLength: 1024}
        label: {type: string, maxLength: 256}
        model: {type: string, maxLength: 256}
        manufacturer: {type: string, maxLength: 256}
        device_type: {type: string, maxLength: 256}
        updated: {type: string, format: date-time}
        expires: {type: string, format: date-time}
    DeviceRule:
      type: object
      additionalProperties: false
      required: [id, name, domains]
      properties:
        id: {type: string, minLength: 1, maxLength: 64, pattern: '^[a-z0-9_-]+$'}
        name: {type: string, minLength: 1, maxLength: 256}
        category: {type: string, enum: [unknown, phone, tablet, laptop, desktop, tv, speaker, printer, camera, lighting, appliance, server, console]}
        reason: {type: string, maxLength: 1024}
        icon: {$ref: '#/components/schemas/DeviceIcon'}
        domains: {type: array, maxItems: 256, items: {type: string, minLength: 1, maxLength: 253}, description: Exact lowercase DNS names without trailing dots; custom rules need at least one domain}
    DeviceRuleEntry:
      type: object
      required: [rule, origin, enabled, available]
      properties:
        rule: {$ref: '#/components/schemas/DeviceRule'}
        builtin: {$ref: '#/components/schemas/DeviceRule'}
        origin: {type: string, enum: [builtin, modified, custom]}
        enabled: {type: boolean}
        available: {type: boolean, description: False for retained overrides whose baseline is absent from this release}
    DeviceRulesRead:
      type: object
      required: [revision, status, entries, customized]
      properties:
        revision: {type: string}
        status: {$ref: '#/components/schemas/Activation'}
        entries: {type: array, items: {$ref: '#/components/schemas/DeviceRuleEntry'}}
        customized: {type: boolean}
    DeviceRulesMutation:
      type: object
      additionalProperties: false
      required: [revision, action]
      properties:
        revision: {type: string, minLength: 1}
        action: {type: string, enum: [save, enable, delete, reset]}
        id: {type: string, minLength: 1, maxLength: 64}
        rule: {$ref: '#/components/schemas/DeviceRule'}
        enabled: {type: boolean}
      description: 'save requires id and matching rule. enable requires id and enabled. delete requires a custom id. reset with id restores one rule; without id resets the entire catalogue. rule/enabled are accepted only by their corresponding actions.'
    DeviceIcon:
      type: string
      maxLength: 80
      pattern: '^([a-z0-9]+(-[a-z0-9]+)*)?$'
      description: Optional kebab-case Lucide icon name from the bundled version. Unknown names are rejected when saving configuration.
    DeviceEnrichment:
      type: object
      description: Current derived device presentation; explicit client names always take priority over discovered names. Not an authenticated physical identity.
      required: [category, reason, inferred, fresh, evidence]
      properties:
        category: {type: string, enum: [unknown, phone, tablet, laptop, desktop, tv, speaker, printer, camera, lighting, appliance, server, console]}
        icon: {$ref: '#/components/schemas/DeviceIcon'}
        reason: {type: string}
        inferred: {type: boolean}
        fresh: {type: boolean}
        hostname: {type: string}
        model: {type: string}
        manufacturer: {type: string}
        evidence: {type: array, maxItems: 16, items: {$ref: '#/components/schemas/DeviceEvidence'}}
        dns_guess: {$ref: '#/components/schemas/DNSGuess'}
    DNSGuess:
      type: object
      description: Lowest-priority device-name guess based on recent DNS questions, not verified product identity.
      required: [rule, reason, domains, expires]
      properties:
        rule: {type: string}
        reason: {type: string}
        expires: {type: string, format: date-time}
        domains:
          type: array
          maxItems: 16
          items:
            type: object
            required: [domain, first_seen, last_seen, queries]
            properties:
              domain: {type: string}
              first_seen: {type: string, format: date-time}
              last_seen: {type: string, format: date-time}
              queries: {type: string, pattern: '^[0-9]+$'}
    ClientsResponse:
      type: object
      required: [status, observed_available]
      properties:
        status: {$ref: '#/components/schemas/Activation'}
        items:
          type: array
          items: {$ref: '#/components/schemas/PolicyClient'}
        configuration_error: {type: string}
        observed_available: {type: boolean}
        observed: {$ref: '#/components/schemas/ObservedClients'}
        policy_summaries:
          type: object
          description: Compact saved and active summaries keyed by authoritative policy_id, compiled in bounded work per inventory request. No inherited rules or routes are serialized here.
          additionalProperties:
            type: object
            required: [desired, active]
            properties:
              desired: {$ref: '#/components/schemas/ClientPolicySummary'}
              active:
                oneOf:
                  - {$ref: '#/components/schemas/ClientPolicySummary'}
                  - {type: 'null'}
    ClientPolicySummary:
      type: object
      required: [profile_id, override_count, blocking, filtering, global_paused, source_unavailable]
      properties:
        profile_id: {type: string}
        override_count: {type: integer, minimum: 0}
        blocking: {type: boolean}
        filtering: {type: boolean}
        global_paused: {type: boolean}
        source_unavailable: {type: boolean}
    Activation:
      type: object
      required: [saved_revision, active_revision, active_generation, pending, recovered, restart_required, sources]
      properties:
        saved_revision: {type: string}
        active_revision: {type: string}
        active_generation: {type: string, pattern: '^[0-9]+$'}
        pending: {type: boolean}
        recovered: {type: boolean}
        restart_required: {type: boolean}
        error: {type: string}
        sources:
          type: array
          items:
            type: object
            required: [id, enabled, usable, rules]
            properties:
              id: {type: string}
              enabled: {type: boolean}
              usable: {type: boolean, description: Last usable source membership exists; may remain true alongside refresh error}
              rules: {type: integer}
              sha256: {type: string}
              error: {type: string}
        dashboard_hosts:
          description: Unaccepted exact local A/AAAA names pointing to this admin listener; returned after saving records. Approval is a separate revision-checked records PATCH.
          type: array
          items:
            type: object
            required: [name, host, url]
            properties:
              name: {type: string}
              host: {type: string}
              url: {type: string, format: uri}
    UInt64:
      $ref: '#/components/schemas/Decimal'
    DHCPAvailability:
      type: object
      additionalProperties: false
      required: [supported, code, reason]
      description: Platform and deployment capability, independent of configured/enabled state and runtime readiness. Unsupported deployments reject DHCP enablement and diagnostic jobs through all control transports.
      properties:
        supported: {type: boolean}
        code: {type: string, enum: [supported, unsupported_platform, docker_desktop, unknown_deployment]}
        reason: {type: string, description: Human-readable explanation when unsupported; empty when supported}
    DHCPSetup:
      type: object
      additionalProperties: false
      required: [config, suggested, fixed_address, message]
      description: Read-only proposed settings with blank fields filled from local Linux network metadata and defaults. Never saved or enabled automatically. Pool suggestions exclude known local and reserved addresses, not unknown leases on other servers.
      properties:
        config: {$ref: '#/components/schemas/DHCPSettings'}
        suggested:
          type: array
          items: {type: string}
          description: Fields filled in by detection or defaults rather than saved configuration
        fixed_address:
          type: string
          enum: ['yes', 'no', unknown]
          description: Whether the detected IPv4 address is currently permanent on the host; not proof of persistent network configuration
        message: {type: string, description: Explanation when automatic network selection is unavailable or incomplete}
    DHCPSettings:
      type: object
      required: [enabled, interface, server_ip, subnet, gateway, range_start, range_end, lease_seconds, local_domain, max_leases, reservations]
      properties:
        enabled: {type: boolean, default: false}
        interface: {type: string, maxLength: 15}
        server_ip: {type: string, description: Static IPv4 server and advertised DNS address; empty allowed while disabled}
        subnet: {type: string, description: Canonical IPv4 subnet /0 through /30; empty allowed while disabled}
        gateway: {type: string, description: IPv4 router outside dynamic pool and different from server IP}
        range_start: {type: string, description: Inclusive IPv4 pool start; maximum span 65536 addresses}
        range_end: {type: string, description: Inclusive IPv4 pool end}
        lease_seconds: {type: integer, minimum: 0, maximum: 604800, description: Advertised lease duration in seconds; 60..604800 when supplied, 0 allowed only while disabled}
        local_domain: {type: string, maxLength: 189, description: DNS domain outside .local; empty allowed while disabled}
        max_leases: {type: integer, minimum: 0, maximum: 4096, description: Lease-state capacity; 0 selects default 1024}
        reservations: {type: array, maxItems: 4096, items: {$ref: '#/components/schemas/DHCPReservation'}}
    DHCPReservation:
      type: object
      additionalProperties: false
      required: [id, address]
      description: Exactly one nonempty mac or client_id. Address must be usable in the configured subnet; IDs, identities, addresses and supplied hostnames must be unique.
      properties:
        id: {type: string, minLength: 1, maxLength: 63, pattern: '^[A-Za-z0-9]([A-Za-z0-9-]*[A-Za-z0-9])?$'}
        mac: {type: string, maxLength: 17, description: Unicast Ethernet MAC; empty means absent}
        client_id: {type: string, maxLength: 510, pattern: '^([0-9a-fA-F]{2})*$', description: Opaque client ID bytes encoded as hex; empty means absent}
        address: {type: string, format: ipv4}
        hostname: {type: string, maxLength: 63}
    DHCPSettingsMutation:
      type: object
      additionalProperties: false
      required: [revision, edits]
      properties:
        revision: {type: string, minLength: 1}
        edits:
          type: array
          minItems: 1
          maxItems: 16
          items:
            type: object
            additionalProperties: false
            required: [path, value]
            properties:
              path: {type: array, minItems: 1, maxItems: 1, items: {type: string, enum: [enabled, interface, server_ip, subnet, gateway, range_start, range_end, lease_seconds, local_domain, max_leases]}}
              value: {type: [string, integer, boolean], description: Field-appropriate scalar; lease_seconds and max_leases are integers, enabled is boolean}
    DHCPReservationMutation:
      type: object
      additionalProperties: false
      required: [revision, edits]
      properties:
        revision: {type: string, minLength: 1}
        edits:
          type: array
          minItems: 1
          maxItems: 16
          items:
            type: object
            additionalProperties: false
            required: [path, value]
            properties:
              path: {type: array, minItems: 1, maxItems: 1, items: {type: string, enum: [mac, client_id, address, hostname]}}
              value: {type: string, description: Set the old identity field to empty when changing identity kind in the same grouped edit}
    DHCPLeaseState:
      type: string
      enum: [probing, offered, commit-pending, bound, quarantined]
    DHCPLease:
      type: object
      required: [address, mac, hostname, state, expiry, hold_until]
      properties:
        address: {type: string, format: ipv4}
        mac: {type: string}
        client_id: {type: string, maxLength: 510, description: Hex opaque bytes; omitted for MAC identity}
        hostname: {type: string, maxLength: 63}
        state: {$ref: '#/components/schemas/DHCPLeaseState'}
        expiry: {type: string, format: date-time, description: UTC advertised grant or quarantine expiry; not the ownership reclamation deadline}
        hold_until: {type: string, format: date-time, description: UTC conservative ownership horizon; not DNS name lifetime}
    DHCPStatus:
      type: object
      required: [state, desired_generation, applied_generation, desired_enabled, desired_interface, desired_server_ip, applied_enabled, interface, server_ip, runtime]
      properties:
        state: {type: string, enum: [disabled, starting, running, degraded, error]}
        desired_generation: {$ref: '#/components/schemas/UInt64'}
        applied_generation: {$ref: '#/components/schemas/UInt64'}
        pending_generation: {$ref: '#/components/schemas/UInt64'}
        desired_enabled: {type: boolean}
        applied_enabled: {type: boolean}
        desired_interface: {type: string}
        desired_server_ip: {type: string}
        interface: {type: string}
        server_ip: {type: string}
        last_error: {type: string}
        runtime:
          type: object
          required: [generation, storage, capacity, held, pending, clock_suspended, transport]
          properties:
            generation: {$ref: '#/components/schemas/UInt64'}
            storage: {type: string, description: 'healthy, failed, uncertain, unopened or closed; empty before initialization'}
            capacity: {$ref: '#/components/schemas/UInt64'}
            held: {$ref: '#/components/schemas/UInt64'}
            pending: {$ref: '#/components/schemas/UInt64'}
            clock_suspended: {type: boolean}
            error: {type: string}
            transport:
              type: object
              properties:
                Received: {$ref: '#/components/schemas/UInt64'}
                Admitted: {$ref: '#/components/schemas/UInt64'}
                Oversized: {$ref: '#/components/schemas/UInt64'}
                RateLimited: {$ref: '#/components/schemas/UInt64'}
                QueueFull: {$ref: '#/components/schemas/UInt64'}
                Malformed: {$ref: '#/components/schemas/UInt64'}
    DHCPCheckInput:
      type: object
      additionalProperties: false
      description: Explicit job checks configured interface/static address and socket permissions plus bound DNS listener and configuration conflicts; it does not scan every pool address or prove LAN/firewall reachability. At most one job runs. Input at most 4 KiB. Inspect results via list_jobs.
      properties:
        probe_other_servers: {type: boolean, default: false, description: Explicitly send one DISCOVER on the configured interface; never REQUEST a lease. Observe at most 64 packets and 16 other server IDs. No offer is not proof of absence. Requires Linux and exclusive UDP 68.}
        timeout_ms: {type: integer, minimum: 100, maximum: 3000, default: 1000, description: Other-server observation deadline in milliseconds}
    DHCPCheckResult:
      type: object
      required: [generation, checked_at, timeout_ms, dhcp, probe_requested, other_servers, probe_truncated, observation, warning, checks]
      properties:
        generation: {$ref: '#/components/schemas/UInt64'}
        checked_at: {type: string, format: date-time}
        timeout_ms: {type: integer}
        dhcp: {$ref: '#/components/schemas/DHCPStatus'}
        probe_requested: {type: boolean}
        other_servers: {type: array, maxItems: 16, items: {type: string, format: ipv4}}
        probe_truncated: {type: boolean}
        observation: {type: string, enum: [not_probed, failed, no_offer_observed, offers_observed]}
        warning: {type: string}
        checks: {type: object, additionalProperties: {type: string}}
    UpstreamAdd:
      type: object
      additionalProperties: false
      required: [revision, item]
      properties:
        revision: {type: string, minLength: 1}
        item:
          oneOf:
            - {type: string, minLength: 1, description: 'Unicast literal IP (default port 53), IP:port, https://host/path or tls://host[:port]. URLs disallow credentials and fragments; TLS URLs disallow paths and queries.'}
            - type: object
              additionalProperties: false
              required: [preset]
              properties:
                preset: {type: string, enum: [cloudflare, google, quad9]}
                transport: {type: string, enum: [https, plain], default: plain, description: 'https adds the provider DoH URL; plain adds the standard IPv4 pair. Omitted transport retains legacy plaintext behavior. Existing entries are skipped.'}
    Mutation:
      type: object
      required: [revision]
      properties:
        revision: {type: string}
        accept_admin_host:
          type: string
          description: 'For PATCH /records only, without edits/item/index: accept this saved local A/AAAA name for dashboard access. Rechecks local interface and admin listener, persists admin.allowed_hosts, and activates without restart.'
        edits:
          type: array
          items:
            type: object
            required: [path, value]
            properties:
              path:
                type: array
                minItems: 1
                items: {type: string}
                description: 'Collection PATCH paths are relative to the collection and start with a zero-based index string: ["1","enabled"] for lists, ["0","name"] for clients, ["0"] for upstreams. Omit the collection prefix. Settings PATCH and staged configuration paths start at the configuration root, for example ["lists","1","enabled"] or ["dns","bootstrap_dns"]. Read the current collection and saved_revision before editing.'
              value:
                description: 'String arrays are accepted only for naming.mdns.interfaces (up to 8 names, 64 characters each) and dns.bootstrap_dns (1–16 literal IP:port resolvers). Set bootstrap_dns to ["1.1.1.1:53","9.9.9.9:53"] to reset to defaults. An empty bootstrap list is invalid; other paths require scalars.'
                oneOf:
                  - {type: [string, integer, boolean]}
                  - {type: array, maxItems: 16, items: {type: string, minLength: 1, maxLength: 64}}
        item:
          description: 'Collection item. For upstreams see UpstreamAdd: a literal IP (default port 53), IP:port, HTTPS/TLS URL, or provider preset with optional transport https or plain. Omitted transport retains plaintext behavior.'
        index: {type: integer, minimum: 0}
    Job:
      type: object
      required: [id, kind, state, created]
      properties:
        id: {type: string, pattern: '^[0-9]+$'}
        kind: {type: string}
        state: {type: string, enum: [running, succeeded, failed]}
        created: {type: string, format: date-time}
        result:
          description: 'Kind-specific result. upstream-probe returns UpstreamProbeResult; support-bundle returns SupportBundleResult; dhcp-check returns DHCPCheckResult. Other job kinds retain their documented result shapes.'
        error: {type: string}
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id, field_errors]
          properties:
            code: {type: string}
            message: {type: string}
            request_id: {type: string}
            active_generation: {type: string, pattern: '^[0-9]+$'}
            field_errors:
              type: array
              items:
                type: object
                required: [path, message]
                properties:
                  path: {type: array, items: {type: string}, description: 'Path relative to the JSON request body, for example ["edits","0","path"] or ["name"].'}
                  message: {type: string, description: Explanation and correction for this field}
  responses:
    Activation:
      description: Validated and activated configuration
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Activation'}
    Error:
      description: '400 malformed/bad_request, 401 auth, 403 CSRF/Host/Origin, 404 missing or expired detail, 409 revision/generation conflict, 422 validation, 429 capacity, 503 unavailable'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}

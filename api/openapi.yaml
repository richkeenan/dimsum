openapi: 3.1.0
info:
  title: dimsum control API
  version: 1.0.0
  description: |
    All generation and job IDs are decimal strings. Content revisions and transaction IDs
    are opaque SHA256 strings. No unconfigured statistics dependency returns fabricated data.
    Browser-session mutations require Origin and X-CSRF-Token obtained at login.
    Opaque bearer tokens grant full administrator access without browser Origin/CSRF
    credentials. Tokens have a separate lifetime from browser sessions and remain
    valid until explicitly revoked. At most 32 tokens may be active; plaintext is
    returned only at creation. Collections use YAML
    schema field names. PATCH paths are relative to the collection (including index),
    or absolute configuration paths for settings. Unsupported comment-preserving edits
    fail explicitly. Successful saves include saved and active configuration identities.
    History windows are half-open [from,to), positive, and at most 366 days. Timestamps
    use UTC with at most microsecond precision. Defaults end at the current UTC minute
    and start one hour earlier; when only to is provided, from defaults to to minus
    one hour. All endpoints share these defaults. updated_at is the response computation
    time, not a promise of durable observation coverage; complete carries that meaning.
    Reuse explicit range values across requests for a fixed dashboard window.
    MCP tools are explicitly opted in with path-level x-mcp-tools metadata. Path and
    query parameters are top-level tool arguments; JSON request bodies use the body
    argument. Browser sessions, token management, password changes, binary downloads,
    event streams, and specification downloads remain HTTP/CLI/UI operations only.
security:
  - session: []
  - bearer: []
paths:
  /api/v1/openapi.json:
    get:
      summary: Read the authenticated OpenAPI document as JSON
      responses:
        '200':
          description: Authoritative OpenAPI document
          content:
            application/json:
              schema: {type: object}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/openapi.yaml:
    get:
      summary: Read the authenticated OpenAPI document as YAML
      responses:
        '200':
          description: Authoritative OpenAPI document
          content:
            application/yaml:
              schema: {type: string}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/tokens:
    get:
      summary: List active full-administrator bearer tokens
      responses:
        '200':
          description: Metadata only; plaintext tokens cannot be retrieved
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, maxItems: 32, items: {$ref: '#/components/schemas/Token'}}
        default: {$ref: '#/components/responses/Error'}
    post:
      summary: Create an opaque full-administrator bearer token
      description: At most 32 active tokens. Store the returned plaintext token; it is shown only once. Token management is not an MCP tool.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: {type: string, minLength: 1, maxLength: 80}
      responses:
        '200':
          description: Created token and one-time plaintext credential
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/Token'}
                  - type: object
                    required: [token]
                    properties:
                      token: {type: string, readOnly: true, description: Opaque full-administrator bearer credential returned only at creation}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/tokens/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    delete:
      summary: Revoke a bearer token immediately
      responses:
        '200':
          description: Token revoked; subsequent requests with it are unauthorized
          content:
            application/json:
              schema:
                type: object
                required: [revoked]
                properties:
                  revoked: {type: boolean, const: true}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/password:
    post:
      summary: Change the administrator password
      description: |
        Accepts 1–1024 UTF-8 bytes, including admin; no forced-change flow.
        Browser-session requests require the session cookie, Origin and X-CSRF-Token;
        bearer-authenticated requests do not require browser Origin/CSRF credentials.
        The permission-protected Unix socket uses filesystem authentication.
        Publishes an immutable credential generation through the configuration coordinator.
        All previous browser sessions are revoked before success returns; log in again.
        Bearer tokens have a separate lifetime and are revoked explicitly through token management.
        Pending external configuration edits or concurrent writes can return 409.
        CLI equivalent is dimsum control password @- with the same JSON body.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PasswordChange'}
      responses:
        '200': {$ref: '#/components/responses/Activation'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/catalog:
    x-mcp-tools:
      get: {name: get_catalog, description: Inspect predefined filter subscription choices}
    get:
      summary: Inspect predefined subscription choices
      description: Availability describes parser support, not download state. Defaults are metadata and do not enable subscriptions. CLI equivalent is dimsum control catalog.
      responses:
        '200':
          description: Predefined catalog metadata
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Catalog'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/config/backups/{id}:
    get:
      summary: Download the most recent completed configuration backup
      description: Owner-authenticated archive including necessary credentials. Expires at the next backup or restart.
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Configuration archive
          content:
            application/x-tar:
              schema: {type: string, format: binary}
        default: {$ref: '#/components/responses/Error'}
  /session:
    post:
      security: []
      summary: Authenticate the single administrator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: {type: string}
      responses:
        '200':
          description: HttpOnly SameSite=Strict cookie and CSRF token
          content:
            application/json:
              schema:
                type: object
                required: [csrf_token, expires_at]
                properties:
                  csrf_token: {type: string}
                  expires_at: {type: string, format: date-time}
        default: {$ref: '#/components/responses/Error'}
    delete:
      summary: Revoke current session
      security:
        - session: []
      responses:
        '200': {description: Logged out}
        default: {$ref: '#/components/responses/Error'}
  /health/live:
    get:
      security: []
      responses:
        '200': {description: Process live}
  /health/ready:
    get:
      security: []
      responses:
        '200': {description: Active configuration available}
        '503': {description: No active configuration}
  /api/v1/summary:
    x-mcp-tools:
      get: {name: get_summary, description: Get retained query totals and observation completeness}
    get:
      description: Retained admitted-query totals; rejected admissions are separate. Missing history is 503.
      parameters: &rangeParameters
        - {$ref: '#/components/parameters/From'}
        - {$ref: '#/components/parameters/To'}
      responses:
        '200':
          description: Retained totals and observation completeness
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HistorySummary'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/timeseries:
    x-mcp-tools:
      get: {name: get_timeseries, description: Get bounded query history time buckets}
    get:
      description: |
        At most 1500 buckets. Auto resolution is 60, then 3600, then 86400 seconds
        according to the point budget. Full buckets use retained rollups; partial
        first/last buckets aggregate retained detail without expanding the requested
        window. Partial edges can therefore be incomplete after detail retention.
        In incomplete windows empty buckets are gaps with null counters, not zero
        traffic. Populated buckets retain actual counts but are marked incomplete.
      parameters:
        - {$ref: '#/components/parameters/From'}
        - {$ref: '#/components/parameters/To'}
        - {name: resolution_seconds, in: query, schema: {type: integer, enum: [60, 3600, 86400]}}
      responses:
        '200':
          description: Bounded history buckets
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HistorySeries'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/rankings:
    x-mcp-tools:
      get: {name: get_rankings, description: Get top clients and blocked domains for a history window}
    get:
      description: Top ten clients by admitted requests and exact domains by blocks; stable identity ties.
      parameters: *rangeParameters
      responses:
        '200':
          description: Exact retained rankings
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HistoryRankings'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/queries:
    x-mcp-tools:
      get: {name: list_queries, description: List a bounded page of retained DNS queries}
    get:
      description: |
        Descending timestamp and ID keyset page with a fixed insertion ceiling.
        Cursor binds normalized filters and window. With a cursor, omitted from/to
        reuse its original window; repeat the same filters on every page. Malformed
        cursors and changed filters/range return 400 bad_request. Unknown or repeated
        parameters are rejected. No offset pagination or substring-name search.
      parameters:
        - {$ref: '#/components/parameters/From'}
        - {$ref: '#/components/parameters/To'}
        - {$ref: '#/components/parameters/Limit'}
        - {name: cursor, in: query, schema: {type: string, maxLength: 2048}}
        - {name: name, in: query, description: 'Exact name; accepts canonical DNS decimal escapes from displayed names, or dot for root.', schema: {type: string}}
        - {name: client, in: query, description: Literal observed IPv4 or IPv6 address without zone, schema: {type: string}}
        - {name: outcome, in: query, schema: {$ref: '#/components/schemas/Outcome'}}
        - {name: qtype, in: query, description: 'DNS type mnemonic, decimal 1–65535, or TYPE<number>', schema: {type: string}}
        - {name: boot_id, in: query, description: 'Exact process boot identity; required with rule_id or upstream_id', schema: {type: string, minLength: 1, maxLength: 128}}
        - {name: generation, in: query, description: 'Canonical uint32 decimal configuration generation; required with rule_id or upstream_id', schema: {type: string, pattern: '^(0|[1-9][0-9]*)$'}}
        - {name: rule_id, in: query, description: 'Canonical uint32 decimal rule number, scoped by boot_id and generation', schema: {type: string, pattern: '^(0|[1-9][0-9]*)$'}}
        - {name: upstream_id, in: query, description: 'Canonical uint16 decimal upstream number, scoped by boot_id and generation because endpoints can change on reload', schema: {type: string, pattern: '^(0|[1-9][0-9]*)$'}}
        - {name: source_id, in: query, description: 'Exact archived source identity, at most 512 UTF-8 bytes. Legacy or oversized identities are unavailable, never inferred from descriptions.', schema: {type: string, minLength: 1, maxLength: 512}}
      responses:
        '200':
          description: Retained query page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HistoryQueries'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/queries/{id}:
    x-mcp-tools:
      get: {name: get_query, description: Inspect a retained DNS query by its decimal string ID}
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, pattern: '^[1-9][0-9]*$'}}
    get:
      description: One retained event with boot-scoped historical rule metadata; 404 if absent or expired.
      responses:
        '200':
          description: Available historical fields, explicitly distinguishing missing metadata
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HistoryDetail'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/settings:
    x-mcp-tools:
      get: {name: get_settings, description: Inspect authoritative configuration and activation status}
      patch: {name: update_settings, description: Apply revision-checked settings edits}
    get:
      responses:
        '200':
          description: Authoritative parsed configuration (no secret file contents), status, or configuration_error for invalid disk text
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {$ref: '#/components/schemas/Activation'}
                  config: {type: object}
                  configuration_error: {type: string}
        default: {$ref: '#/components/responses/Error'}
    patch: &patch
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Mutation'}
      responses:
        '200': {$ref: '#/components/responses/Activation'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/lists: &collection
    x-mcp-tools:
      get: {name: list_filter_lists, description: List configured filter subscriptions and activation status}
      post: {name: add_filter_list, description: Append a filter subscription using the current revision and item}
      patch: {name: update_filter_lists, description: Apply revision-checked filter subscription edits}
      delete: {name: remove_filter_list, description: Remove a filter subscription using the current revision and zero-based index}
    get:
      responses:
        '200':
          description: Configured items, not discovered statistics
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {$ref: '#/components/schemas/Activation'}
                  items: {type: array, items: {}}
                  configuration_error: {type: string}
        default: {$ref: '#/components/responses/Error'}
    post:
      <<: *patch
      description: Append one item using revision and item
    patch: *patch
    delete:
      <<: *patch
      description: Remove item using revision and zero-based index
  /api/v1/rules:
    <<: *collection
    x-mcp-tools:
      get: {name: list_rules, description: List configured DNS policy rules}
      post: {name: add_rule, description: Append a DNS policy rule using the current revision and item}
      patch: {name: update_rules, description: Apply revision-checked DNS policy rule edits}
      delete: {name: remove_rule, description: Remove a DNS policy rule using the current revision and zero-based index}
  /api/v1/records:
    <<: *collection
    x-mcp-tools:
      get: {name: list_records, description: List configured local DNS records}
      post: {name: add_record, description: Append a local DNS record using the current revision and item}
      patch: {name: update_records, description: Apply revision-checked local DNS record edits}
      delete: {name: remove_record, description: Remove a local DNS record using the current revision and zero-based index}
  /api/v1/clients:
    <<: *collection
    x-mcp-tools:
      get: {name: list_clients, description: List configured client overrides and bounded retained observations}
      post: {name: add_client, description: Append a client override using the current revision and item}
      patch: {name: update_clients, description: Apply revision-checked client override edits}
      delete: {name: remove_client, description: Remove a client override using the current revision and zero-based index}
    get:
      description: Configured overrides in items, plus optional bounded retained observations and cached names.
      parameters:
        - {$ref: '#/components/parameters/From'}
        - {$ref: '#/components/parameters/To'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: DNS-observed address identities, not a physical-device inventory
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ClientsResponse'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/upstreams:
    <<: *collection
    x-mcp-tools:
      get: {name: list_upstreams, description: List configured upstream DNS servers}
      post: {name: add_upstream, description: Append an upstream DNS server using the current revision and item}
      patch: {name: update_upstreams, description: Apply revision-checked upstream DNS server edits}
      delete: {name: remove_upstream, description: Remove an upstream DNS server using the current revision and zero-based index}
  /api/v1/diagnostics:
    x-mcp-tools:
      get: {name: get_diagnostics, description: Inspect configuration and installed diagnostic measurements}
    get:
      responses:
        '200':
          description: Configuration and installed diagnostic measurements. dns_addresses lists client-facing IP:port endpoints from running DNS listeners, expanding wildcard binds to active interface addresses and excluding loopback and link-local addresses. Addresses on recognised container and VPN interfaces sort last using best-effort interface-name hints; within each group IPv4 precedes IPv6, then addresses and ports sort numerically. This order does not guarantee reachability. IPv6 endpoints use brackets. An empty list means no client-facing address was discovered.
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/blocking:
    x-mcp-tools:
      get: {name: get_blocking, description: Inspect blocking state and pause expiry}
      put: {name: set_blocking, description: Enable blocking or pause until an absolute expiry using the current revision}
    get:
      responses:
        '200': {description: 'Object with status, enabled, pause_until (RFC3339 UTC)'}
        default: {$ref: '#/components/responses/Error'}
    put:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [revision, enabled]
              properties:
                revision: {type: string}
                enabled: {type: boolean}
                pause_until: {type: string, format: date-time, description: Absolute future expiry required when enabled is false}
      responses:
        '200': {$ref: '#/components/responses/Activation'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/rules/test:
    x-mcp-tools:
      post: {name: explain_domain, description: Explain a domain decision with the active policy matcher without performing a DNS lookup, readOnly: true}
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string}
                qtype: {type: string, description: Name-policy matcher is QTYPE independent}
                generation: {type: string, pattern: '^[0-9]+$'}
      responses:
        '200': {description: 'name, normalized, generation, decision from active policy matcher; not a DNS lookup'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/config/transactions:
    x-mcp-tools:
      post: {name: stage_configuration, description: Validate and stage revision-checked settings edits without activating them}
    post:
      <<: *patch
      description: Validate/stage settings edits without activation
      responses:
        '200': {description: 'id (opaque content hash) and revision; commit explicitly'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/config/transactions/{id}/commit:
    x-mcp-tools:
      post: {name: commit_configuration, description: Commit a staged configuration transaction by its opaque content hash}
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    post:
      responses:
        '200': {$ref: '#/components/responses/Activation'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/jobs:
    x-mcp-tools:
      get: {name: list_jobs, description: Inspect the last 32 process-lifetime jobs and their results}
      post: {name: create_job, description: Start a refresh or backup or restore or diagnostic job and inspect its result with list_jobs}
    get:
      responses:
        '200':
          description: Last 32 jobs, process lifetime only
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/Job'}}
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              properties:
                kind: {type: string, enum: [refresh, backup, restore, upstream-probe, support-bundle]}
                input:
                  description: 'For upstream-probe use UpstreamProbeInput; for support-bundle use SupportBundleInput. Diagnostic input is capped at 4 KiB. Validation failures are reported in the asynchronous job status.'
              allOf:
                - if:
                    properties:
                      kind: {const: upstream-probe}
                  then:
                    required: [input]
                    properties:
                      input: {$ref: '#/components/schemas/UpstreamProbeInput'}
                - if:
                    properties:
                      kind: {const: support-bundle}
                  then:
                    properties:
                      input: {$ref: '#/components/schemas/SupportBundleInput'}
      responses:
        '202':
          description: Accepted; one running job maximum
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Job'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/events:
    get:
      responses:
        '200':
          description: 'SSE: reset requires summary refetch; status includes configuration and jobs, at most once/second. Eight clients, two-second write deadline. No replay history.'
          content:
            text/event-stream:
              schema: {type: string}
        default: {$ref: '#/components/responses/Error'}
components:
  parameters:
    From:
      name: from
      in: query
      description: Inclusive UTC RFC3339 timestamp; default is to minus one hour.
      schema: {type: string, format: date-time}
    To:
      name: to
      in: query
      description: Exclusive UTC RFC3339 timestamp; default is current UTC minute.
      schema: {type: string, format: date-time}
    Limit:
      name: limit
      in: query
      schema: {type: integer, default: 100, minimum: 1, maximum: 200}
  securitySchemes:
    session: {type: apiKey, in: cookie, name: dimsum_session, description: Browser-session authentication; mutations also require Origin and X-CSRF-Token}
    bearer: {type: http, scheme: bearer, description: Opaque full-administrator token with independent lifetime until explicit revocation; checked on every HTTP request including MCP requests; no browser Origin/CSRF credentials required}
  schemas:
    Token:
      type: object
      required: [id, name, created_at]
      properties:
        id: {type: string, description: Opaque token metadata identifier; never a credential}
        name: {type: string, minLength: 1, maxLength: 80}
        created_at: {type: string, format: date-time}
    PasswordChange:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 1024
          writeOnly: true
          description: Nonempty password, maximum 1024 UTF-8 bytes. Fresh installations initialize a salted hash of admin only when no credential exists.
    Catalog:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/CatalogItem'}
    CatalogItem:
      type: object
      required: [id, label, description, url, dialect, domain_kind, available, unavailable_reason, default_enabled]
      properties:
        id: {type: string}
        label: {type: string}
        description: {type: string}
        url: {type: string, format: uri}
        dialect: {type: string, enum: [hosts, domains, dns-adblock]}
        domain_kind: {type: string, enum: [exact, suffix]}
        available: {type: boolean}
        unavailable_reason: {type: string}
        default_enabled: {type: boolean}
    UpstreamProbeInput:
      type: object
      additionalProperties: false
      required: [endpoint]
      properties:
        endpoint: {type: string, description: Literal IP:port currently configured in the active primary or fallback pool; arbitrary destinations are rejected}
        timeout_ms: {type: integer, minimum: 50, maximum: 3000, default: 1000}
    UpstreamProbeResult:
      type: object
      required: [endpoint, generation, name, qtype, state, responding, healthy, attempts, diagnostic_probes, duration_us, timeout_ms, checked_at]
      description: |
        One isolated root NS check using the validated DNS exchange engine. UDP
        may retry over TCP on truncation, at most two attempts within one deadline.
        Live configuration, cache, and upstream circuit state are unchanged. All
        actual attempts count once as non-client health probes; no client traffic
        or history event is recorded. Response errors/timeouts are completed
        diagnostic findings; parent cancellation fails the job.
      properties:
        endpoint: {type: string}
        generation: {$ref: '#/components/schemas/Decimal'}
        name: {type: string, const: '.'}
        qtype: {type: string, const: NS}
        state: {type: string, enum: [healthy, responding_error, no_valid_response, cancelled]}
        responding: {type: boolean, description: A validated DNS response was observed, not merely a reachable host}
        healthy: {type: boolean, description: This isolated check returned NOERROR; not a live circuit-state claim}
        rcode: {type: integer, minimum: 0, maximum: 65535}
        transport: {type: string, enum: [udp, tcp], description: Omitted when validated response transport is unavailable}
        attempts: {$ref: '#/components/schemas/Decimal'}
        diagnostic_probes: {$ref: '#/components/schemas/Decimal'}
        duration_us: {$ref: '#/components/schemas/Decimal'}
        timeout_ms: {type: integer, minimum: 50, maximum: 3000}
        error: {type: string}
        checked_at: {type: string, format: date-time}
    SupportBundleInput:
      type: object
      additionalProperties: false
      description: History is omitted by default. Explicit opt-in also requires an explicit positive UTC from/to range of at most 24 hours. Range and limit are rejected without opt-in.
      properties:
        include_query_history: {type: boolean, default: false}
        from: {type: string, format: date-time}
        to: {type: string, format: date-time}
        limit: {type: integer, minimum: 1, maximum: 200, default: 50}
    SupportBundleResult:
      type: object
      required: [format, generated_at, build, configuration, diagnostics, contains_secrets, contains_query_history, query_history]
      description: JSON job result capped at 256 KiB; oversized bundles fail explicitly. No secret file contents or archive. URL userinfo, query values, and fragments are redacted, including diagnostic error messages.
      properties:
        format: {type: string, const: dimsum-support-v1}
        generated_at: {type: string, format: date-time}
        build:
          type: object
          required: [go_version, os, architecture, version]
          properties:
            go_version: {type: string}
            os: {type: string}
            architecture: {type: string}
            version: {type: string, description: Embedded Go module version or unknown; development builds can report '(devel)'}
            revision: {type: string}
            modified: {type: string}
        configuration: {type: object, description: Redacted settings inspection including saved/active status}
        diagnostics: {type: object}
        contains_secrets: {type: boolean, const: false}
        contains_query_history: {type: boolean}
        query_history:
          oneOf:
            - {$ref: '#/components/schemas/HistoryQueries'}
            - {type: 'null'}
    Decimal:
      type: string
      pattern: '^(0|[1-9][0-9]*)$'
      description: Unsigned integer encoded as a decimal string, including values beyond JavaScript exact integers.
    HistoryRange:
      type: object
      required: [from, to]
      properties:
        from: {type: string, format: date-time}
        to: {type: string, format: date-time}
    Outcome:
      type: string
      enum: [local, blocked, cache, stale, forwarded, error, rejected]
    HistorySummary:
      type: object
      required: [range, queries, blocked, fresh, stale, rejected, duration_us, complete, updated_at]
      properties:
        range: {$ref: '#/components/schemas/HistoryRange'}
        queries: {$ref: '#/components/schemas/Decimal', description: Admitted terminal query count, excluding rejected admissions}
        blocked: {$ref: '#/components/schemas/Decimal'}
        fresh: {$ref: '#/components/schemas/Decimal'}
        stale: {$ref: '#/components/schemas/Decimal'}
        rejected: {$ref: '#/components/schemas/Decimal'}
        duration_us: {$ref: '#/components/schemas/Decimal', description: Sum of admitted query durations in microseconds}
        complete: {type: boolean}
        updated_at: {type: string, format: date-time}
    HistoryQuery:
      type: object
      required: [id, boot_id, sequence, time, client, client_name, client_name_source, client_name_fresh, name, qtype, qtype_code, qclass, outcome, rcode, duration_us, generation, rule_id, upstream_id, flags]
      properties:
        id: {$ref: '#/components/schemas/Decimal'}
        boot_id: {type: string, description: Boot scope for generation and rule identifiers}
        sequence: {$ref: '#/components/schemas/Decimal'}
        time: {type: string, format: date-time}
        client: {type: string, description: Observed address, always present independently of its friendly name}
        client_name: {type: string, description: Current cached friendly name; empty when unknown, not a historical identity claim}
        client_name_source: {type: string}
        client_name_fresh: {type: boolean}
        client_device: {$ref: '#/components/schemas/DeviceEnrichment'}
        name: {type: string, description: Lowercase byte-safe DNS presentation with decimal escapes; root is empty}
        qtype: {type: string, description: DNS type mnemonic or TYPE<number>}
        qtype_code: {type: integer, minimum: 0, maximum: 65535}
        qclass: {type: integer, minimum: 0, maximum: 65535}
        outcome: {$ref: '#/components/schemas/Outcome'}
        rcode: {type: integer, minimum: 0, maximum: 65535}
        duration_us: {$ref: '#/components/schemas/Decimal'}
        generation: {$ref: '#/components/schemas/Decimal'}
        rule_id: {$ref: '#/components/schemas/Decimal'}
        source_id: {type: string, description: 'Exact archived source identity; empty when unavailable (including legacy history and identities exceeding 512 bytes)'}
        upstream_id: {$ref: '#/components/schemas/Decimal'}
        flags: {type: integer, minimum: 0, maximum: 4294967295, description: 'Bits 0 TCP, 1 coalesced, 2 fallback used, 3 truncated, 4 response-policy block'}
    HistoryQueries:
      type: object
      required: [items, complete, range, updated_at]
      properties:
        items: {type: array, maxItems: 200, items: {$ref: '#/components/schemas/HistoryQuery'}}
        next_cursor: {type: string, description: Omitted on the last page; opaque base64url value}
        complete: {type: boolean, description: Observation/retention completeness, not whether there are more pages}
        range: {$ref: '#/components/schemas/HistoryRange'}
        updated_at: {type: string, format: date-time}
    HistoryDetail:
      allOf:
        - {$ref: '#/components/schemas/HistoryQuery'}
        - type: object
          required: [alias_available, rule_description_available, alias_chain_available, upstream_attempts_available, cache_age_available, ad_trust_available, updated_at]
          properties:
            alias: {type: string, description: One retained matched alias, not a reconstructed chain}
            alias_available: {type: boolean}
            rule_description: {type: string}
            rule_description_available: {type: boolean}
            alias_chain_available: {type: boolean, const: false}
            upstream_attempts_available: {type: boolean, const: false}
            cache_age_available: {type: boolean, const: false}
            ad_trust_available: {type: boolean, const: false}
            updated_at: {type: string, format: date-time}
    HistoryRankings:
      type: object
      required: [clients, domains, complete, range, updated_at]
      properties:
        clients:
          type: array
          maxItems: 10
          items:
            type: object
            required: [address, name, count]
            properties:
              device: {$ref: '#/components/schemas/DeviceEnrichment'}
              address: {type: string}
              name: {type: string}
              count: {$ref: '#/components/schemas/Decimal'}
        domains:
          type: array
          maxItems: 10
          items:
            type: object
            required: [name, count]
            properties:
              name: {type: string}
              count: {$ref: '#/components/schemas/Decimal'}
        complete: {type: boolean}
        range: {$ref: '#/components/schemas/HistoryRange'}
        updated_at: {type: string, format: date-time}
    OutcomeCounts:
      type: object
      required: [local, blocked, cache, stale, forwarded, error, rejected]
      properties:
        local: {$ref: '#/components/schemas/Decimal'}
        blocked: {$ref: '#/components/schemas/Decimal'}
        cache: {$ref: '#/components/schemas/Decimal'}
        stale: {$ref: '#/components/schemas/Decimal'}
        forwarded: {$ref: '#/components/schemas/Decimal'}
        error: {$ref: '#/components/schemas/Decimal'}
        rejected: {$ref: '#/components/schemas/Decimal'}
    HistoryPoint:
      type: object
      required: [time, outcomes, duration_us, histogram, complete, gap]
      properties:
        time: {type: string, format: date-time, description: Bucket start clipped to from for a partial first bucket; ends at the next point or range.to}
        outcomes:
          oneOf:
            - {$ref: '#/components/schemas/OutcomeCounts'}
            - {type: 'null'}
        duration_us:
          oneOf:
            - {$ref: '#/components/schemas/Decimal'}
            - {type: 'null'}
        histogram:
          type: [array, 'null']
          minItems: 8
          maxItems: 8
          items: {$ref: '#/components/schemas/Decimal'}
          description: 'Exclusive microsecond upper bounds: 100, 500, 1000, 5000, 10000, 100000, 1000000, infinity; all terminal outcomes'
        complete: {type: boolean, description: Conservative coverage status for the aligned interior or individual partial edge}
        gap: {type: boolean, description: No observed counts in an incomplete window; null counters must not be graphed as zero}
    HistorySeries:
      type: object
      required: [points, resolution_seconds, complete, range, updated_at]
      properties:
        points: {type: array, maxItems: 1500, items: {$ref: '#/components/schemas/HistoryPoint'}}
        resolution_seconds: {type: integer, enum: [60, 3600, 86400]}
        complete: {type: boolean}
        range: {$ref: '#/components/schemas/HistoryRange'}
        updated_at: {type: string, format: date-time}
    ObservedClients:
      type: object
      required: [items, complete, truncated, range, updated_at]
      properties:
        items:
          type: array
          maxItems: 200
          items:
            type: object
            required: [address, name, name_source, name_fresh, count, blocked, last_seen]
            properties:
              device: {$ref: '#/components/schemas/DeviceEnrichment'}
              address: {type: string}
              name: {type: string}
              name_source: {type: string}
              name_fresh: {type: boolean}
              count: {$ref: '#/components/schemas/Decimal'}
              blocked: {$ref: '#/components/schemas/Decimal'}
              last_seen: {type: string, format: date-time}
        complete: {type: boolean}
        truncated: {type: boolean, description: More than limit observed addresses; distinct from missing observation coverage}
        range: {$ref: '#/components/schemas/HistoryRange'}
        updated_at: {type: string, format: date-time}
    DeviceEvidence:
      type: object
      required: [source, updated, expires]
      properties:
        source: {type: string}
        hostname: {type: string, maxLength: 1024}
        service_type: {type: string, maxLength: 1024}
        label: {type: string, maxLength: 256}
        model: {type: string, maxLength: 256}
        manufacturer: {type: string, maxLength: 256}
        device_type: {type: string, maxLength: 256}
        updated: {type: string, format: date-time}
        expires: {type: string, format: date-time}
    DeviceEnrichment:
      type: object
      description: Current derived device presentation; explicit client names always take priority over discovered names. Not an authenticated physical identity.
      required: [category, reason, inferred, fresh, evidence]
      properties:
        category: {type: string, enum: [unknown, phone, tablet, laptop, desktop, tv, speaker, printer, camera, lighting, appliance, server, console]}
        reason: {type: string}
        inferred: {type: boolean}
        fresh: {type: boolean}
        hostname: {type: string}
        model: {type: string}
        manufacturer: {type: string}
        evidence: {type: array, maxItems: 16, items: {$ref: '#/components/schemas/DeviceEvidence'}}
        dns_guess: {$ref: '#/components/schemas/DNSGuess'}
    DNSGuess:
      type: object
      description: Lowest-priority device-name guess based on recent DNS questions, not verified product identity.
      required: [rule, reason, domains, expires]
      properties:
        rule: {type: string}
        reason: {type: string}
        expires: {type: string, format: date-time}
        domains:
          type: array
          maxItems: 16
          items:
            type: object
            required: [domain, first_seen, last_seen, queries]
            properties:
              domain: {type: string}
              first_seen: {type: string, format: date-time}
              last_seen: {type: string, format: date-time}
              queries: {type: string, pattern: '^[0-9]+$'}
    ClientsResponse:
      type: object
      required: [status, observed_available]
      properties:
        status: {$ref: '#/components/schemas/Activation'}
        items:
          type: array
          items:
            type: object
            required: [address, name]
            properties:
              address: {type: string}
              name: {type: string}
        configuration_error: {type: string}
        observed_available: {type: boolean}
        observed: {$ref: '#/components/schemas/ObservedClients'}
    Activation:
      type: object
      required: [saved_revision, active_revision, active_generation, pending, recovered, restart_required, sources]
      properties:
        saved_revision: {type: string}
        active_revision: {type: string}
        active_generation: {type: string, pattern: '^[0-9]+$'}
        pending: {type: boolean}
        recovered: {type: boolean}
        restart_required: {type: boolean}
        error: {type: string}
        sources: {type: array, items: {type: object}}
        dashboard_hosts:
          description: Unaccepted exact local A/AAAA names pointing to this admin listener; returned after saving records. Approval is a separate revision-checked records PATCH.
          type: array
          items:
            type: object
            required: [name, host, url]
            properties:
              name: {type: string}
              host: {type: string}
              url: {type: string, format: uri}
    Mutation:
      type: object
      required: [revision]
      properties:
        revision: {type: string}
        accept_admin_host:
          type: string
          description: 'For PATCH /records only, without edits/item/index: accept this saved local A/AAAA name for dashboard access. Rechecks local interface and admin listener, persists admin.allowed_hosts, and activates without restart.'
        edits:
          type: array
          items:
            type: object
            required: [path, value]
            properties:
              path: {type: array, items: {type: string}}
              value:
                description: String arrays are accepted only for naming.mdns.interfaces; other paths require scalars.
                oneOf:
                  - {type: [string, integer, boolean]}
                  - {type: array, maxItems: 8, items: {type: string, minLength: 1, maxLength: 64}}
        item:
          description: 'Collection item. For upstreams, accepts a literal IP (default port 53), IP:port, or {"preset":"cloudflare|google|quad9"}. Presets add both standard IPv4 servers atomically, skipping existing addresses.'
        index: {type: integer, minimum: 0}
    Job:
      type: object
      required: [id, kind, state, created]
      properties:
        id: {type: string, pattern: '^[0-9]+$'}
        kind: {type: string}
        state: {type: string, enum: [running, succeeded, failed]}
        created: {type: string, format: date-time}
        result:
          description: 'Kind-specific result. upstream-probe returns UpstreamProbeResult; support-bundle returns SupportBundleResult. Other job kinds retain their documented result shapes.'
        error: {type: string}
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id, field_errors]
          properties:
            code: {type: string}
            message: {type: string}
            request_id: {type: string}
            active_generation: {type: string, pattern: '^[0-9]+$'}
            field_errors: {type: array, items: {type: object}}
  responses:
    Activation:
      description: Validated and activated configuration
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Activation'}
    Error:
      description: '400 malformed/bad_request, 401 auth, 403 CSRF/Host/Origin, 404 missing or expired detail, 409 revision/generation conflict, 422 validation, 429 capacity, 503 unavailable'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
